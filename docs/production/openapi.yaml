openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Sky Rent Production API
  version: 1.0.0
  summary: グロースレンタカー本番バックエンド契約
  description: |
    `SkyRentStore` / `SkyRentPricing` の本番置換用となる、プロバイダー非依存の
    HTTP API 契約。金額・会員ID・請求書払い資格・予約状態はクライアント値を
    信頼せず、必ずサーバー側で決定する。

    日時は UTC の RFC 3339 で送受信し、営業日・料金期間の解釈には
    `Asia/Tokyo` を使用する。金額は税込JPYの整数。予約期間は半開区間
    `[startAt, endAt)` とする。

    Cookie 認証時の変更系リクエストでは `X-CSRF-Token` が必須。
    JWT Bearer 認証時は不要。`POST /reservations` と `POST /inquiries` は
    `Idempotency-Key` が必須で、同じキー・同じbodyの再送は最初の応答を返す。
    匿名clientも事前bootstrapや識別Cookieを使用せず、mutationごとに128bit以上の
    予測困難なkeyを生成する。serverはraw keyを保存・log出力せず、rotation可能な
    server secret付きHMACでactor scopeとkeyを別々に導出する。
    cross-origin配備では環境別の明示allowlistだけを許可し、credential利用時の
    `Access-Control-Allow-Origin: *`を禁止する。`Vary: Origin`を返し、許可headerに
    `Idempotency-Key`、`If-Match`、`X-CSRF-Token`、`X-Guest-Token`、
    `X-Access-Reason`、`X-Marketing-Unsubscribe-Token`を必要最小限で含める。

    管理APIはすべて staff のAAL2 session、`x-required-permissions`、
    `x-location-scope` を毎回サーバー側の最新DB状態で検証する。JWT内のrole、
    permission、location scopeは性能上のhintであり、単独では認可根拠にしない。
    通常のDB操作はcallerのuser JWTで実行してRLSを通す。複数表を原子的に更新する
    場合だけ、固定`search_path`、明示的なscope引数、caller/permission/AAL2再検証、
    監査記録を備えた限定的な`SECURITY DEFINER` RPCを使用できる。service-roleを
    一般的な管理API経路へ公開しない。`x-location-scope`の`global`は全拠点権限、
    `claim-intersection`はqueryと担当拠点の積、`resource`は対象の所属拠点、
    `related-reservations`は関連予約すべての拠点scopeを意味する。
  contact:
    name: Sky Rent API Owners
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
    description: 同一originの本番API。別origin構成では環境ごとに置換する
tags:
  - name: Health
    description: 外形監視用。依存先、構成、例外などの内部詳細は返さない
  - name: Catalog
    description: 公開カタログ
  - name: Legal
    description: 公開中の規約・プライバシー・キャンセルポリシー
  - name: Marketing
    description: 任意の広告メール同意、配信抑止、ログイン不要のunsubscribe
  - name: Availability
    description: 空き検索と見積り。検索結果は確約ではなく、予約作成時に再検証する
  - name: Reservations
    description: 公開予約受付
  - name: Inquiries
    description: 公開問い合わせ受付
  - name: Auth
    description: 会員・スタッフ共通認証
  - name: Me
    description: ログイン主体自身の情報
  - name: Admin Catalog
    description: カタログ管理
  - name: Admin Reservations
    description: 予約・貸渡・返却・入金管理
  - name: Admin Members
    description: 会員・ポイント・クーポン管理
  - name: Admin Invoices
    description: 請求書管理
  - name: Admin Inquiries
    description: 問い合わせ対応
  - name: Admin Operations
    description: ダッシュボード・レポート・スタッフ・設定
  - name: Admin Compliance
    description: 貸渡簿・貸渡証・法定年次報告。PII参照、生成、再交付、提出証跡を全件監査する
security: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: サービス稼働状態
      description: 外形監視用。認証不要で、依存サービス名・接続先・障害理由は返さない。
      responses:
        '200':
          description: リクエスト受付可能
          headers:
            Cache-Control:
              description: ヘルス応答を保存しない
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  value:
                    data:
                      status: ok
                      version: 1.0.0
                      time: '2026-09-16T08:00:00Z'
        '503':
          description: リクエスト受付不可。内部障害の詳細はログだけに記録する
          headers:
            Cache-Control:
              description: ヘルス応答を保存しない
              schema:
                type: string
                const: no-store
            Retry-After:
              description: 推奨再試行秒数
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                unavailable:
                  value:
                    data:
                      status: unavailable
                      version: 1.0.0
                      time: '2026-09-16T08:00:00Z'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /legal-documents/current:
    get:
      tags: [Legal]
      operationId: listCurrentLegalDocuments
      summary: 現在有効な法務文書version一覧
      description: 同意画面はこの応答のversion、language、URIを表示し、送信時に選択したversionを明示する。翻訳版がない場合の日本語正本へのfallbackも応答のlanguageで判別できるようにする。
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: document typeごとに現在有効なversion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocumentListResponse'
        '503':
          description: 必須文書の有効versionを確定できない
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /marketing/unsubscribe:
    post:
      tags: [Marketing]
      operationId: unsubscribeMarketingEmail
      summary: tokenで広告メールをログインせず配信停止
      description: |
        emailのlanding URLはtokenをqueryではなくfragmentにだけ保持できる。browserはfragmentをHTTP requestや
        Referrerへ送信しない。landing JSはanalytics等を起動する前にfragmentを読んでaddress/historyから除去し、
        tokenを `X-Marketing-Unsubscribe-Token` headerへ移してPOSTする。
        server request URL、request/access log、analyticsへtokenを出力せず、ambient Cookieも認証に使わないため
        CSRF tokenは要求しない。初回だけwithdrawn eventとemail destination hashのactive suppressionを
        同一transactionで追記し、同じtokenの再送はeventを重複させず同じ抑止状態を返す。
        token hash自体を冪等scopeとするため、別のIdempotency-Keyは要求しない。
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/MarketingUnsubscribeToken'
      responses:
        '200':
          description: 配信停止済み。既に停止済みの場合も同じ状態を返す
          headers:
            Cache-Control:
              description: preference状態を共有cacheへ保存しない
              schema:
                type: string
                const: private, no-store
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingPreferenceResponse'
        '410':
          description: tokenが無効、期限切れ、または失効済み
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /catalog/categories:
    get:
      tags: [Catalog]
      operationId: listPublicCategories
      summary: 公開中カテゴリ一覧
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: カテゴリ一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /catalog/locations:
    get:
      tags: [Catalog]
      operationId: listPublicLocations
      summary: 公開中拠点一覧
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 拠点一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /catalog/assets:
    get:
      tags: [Catalog]
      operationId: listPublicAssets
      summary: 公開中車両一覧
      parameters:
        - $ref: '#/components/parameters/CategoryCodeQuery'
        - $ref: '#/components/parameters/LocationCodeQuery'
        - name: field
          in: query
          description: |
            カスタム項目フィルタ。`field[bodyType]=SUV` の形式。
            number型は指定値以上、select/text型は完全一致。
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: [string, number]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 車両一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /catalog/assets/{assetCode}:
    parameters:
      - $ref: '#/components/parameters/AssetCodePath'
    get:
      tags: [Catalog]
      operationId: getPublicAsset
      summary: 車両詳細
      responses:
        '200':
          description: 車両詳細
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /catalog/assets/{assetCode}/options:
    parameters:
      - $ref: '#/components/parameters/AssetCodePath'
    get:
      tags: [Catalog]
      operationId: listPublicAssetOptions
      summary: 車両に適用できるオプション一覧
      responses:
        '200':
          description: 共通・カテゴリ専用オプション
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /availability/search:
    post:
      tags: [Availability]
      operationId: searchAvailability
      summary: 空き車両検索
      description: 結果は照会時点の情報であり、予約確定を保証しない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilitySearchRequest'
      responses:
        '200':
          description: 空き状況
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilitySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /quotes:
    post:
      tags: [Availability]
      operationId: createQuote
      summary: サーバー計算による予約見積り
      description: |
        有効期間15分の見積りを作成する。ログイン会員の場合はCookieまたはJWTから
        会員を特定し、利用可能なクーポンだけを適用する。見積りは在庫を確保しない。
      security:
        - {}
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/CsrfTokenOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreateRequest'
      responses:
        '201':
          description: 見積り作成済み
          headers:
            Location:
              description: 作成された見積りの論理URI
              schema:
                type: string
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 冪等キー再利用または選択内容競合
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                idempotencyKeyReused:
                  $ref: '#/components/examples/IdempotencyKeyReused'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /reservations:
    post:
      tags: [Reservations]
      operationId: createReservation
      summary: 予約を確定
      description: |
        asset単位で直列化し、在庫・見積り・クーポン・請求書払い資格を同一DB
        トランザクション内で再検証する。クライアントが送る金額、member ID、
        `invoiceAllowed`、statusは無視する。同じIdempotency-Keyと同じbodyの再送は、
        同じ予約IDとレスポンスを返し、メールも一通だけキューイングする。
      security:
        - {}
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfTokenOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
      responses:
        '201':
          description: 予約確定。確認メールは非同期で送信される
          headers:
            Location:
              description: |
                会員予約は`/v1/me/reservations/{reservationCode}`、guest予約は
                `/v1/guest/reservations/{reservationCode}`。guest URIの利用には確認メールのtokenが必要。
              schema:
                type: string
              example: /v1/guest/reservations/R20260916-01J8ABCD
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
              examples:
                confirmed:
                  value:
                    data:
                      reservationCode: R20260916-01J8ABCD
                      status: confirmed
                      assetCode: V001
                      assetName: 日産 ノート
                      locationCode: loc-kitami
                      startAt: '2026-10-01T00:00:00Z'
                      endAt: '2026-10-02T00:00:00Z'
                      quantity: 1
                      customer:
                        name: 山田 太郎
                        email: taro@example.jp
                        phone: 090-1234-5678
                        company: null
                        licenseLast4: null
                      selectedOptions: []
                      payment:
                        method: onsite
                        status: unpaid
                      price:
                        currency: JPY
                        subtotal: 7700
                        discount: 0
                        total: 7700
                        lines:
                          - type: base
                            label: 基本料金 (1日)
                            amount: 7700
                      emailDeliveryStatus: queued
                      rowVersion: 1
                      createdAt: '2026-09-16T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 会員限定機能を未認証で指定
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 在庫、見積り、クーポン、冪等性の競合
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                availabilityConflict:
                  $ref: '#/components/examples/AvailabilityConflict'
                quoteStale:
                  $ref: '#/components/examples/QuoteStale'
                couponUnavailable:
                  $ref: '#/components/examples/CouponUnavailable'
                idempotencyKeyReused:
                  $ref: '#/components/examples/IdempotencyKeyReused'
        '410':
          description: 見積り期限切れ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                quoteExpired:
                  $ref: '#/components/examples/QuoteExpired'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /guest/reservations/{reservationCode}:
    parameters:
      - $ref: '#/components/parameters/ReservationCodePath'
    get:
      tags: [Reservations]
      operationId: getGuestReservation
      summary: tokenでguest予約を照会
      description: |
        view目的の短命tokenのhashを検証する。expiryまでは再利用でき、利用回数と最終利用時刻を
        追記する。予約cancelまたはtoken再発行で即時失効する。token原文をURL・log・analyticsへ記録しない。
      parameters:
        - $ref: '#/components/parameters/GuestToken'
      responses:
        '200':
          description: guest本人の予約詳細
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: 個人情報を共有cacheへ保存しない
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: token期限切れまたは失効済み
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /guest/reservations/{reservationCode}/cancel:
    parameters:
      - $ref: '#/components/parameters/ReservationCodePath'
    post:
      tags: [Reservations]
      operationId: cancelGuestReservation
      summary: tokenでguest予約をキャンセル
      description: cancel目的の短命・一回限りtokenを成功時に消費し、同予約の全view tokenも失効させて再利用を拒否する。
      parameters:
        - $ref: '#/components/parameters/GuestToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCancellationRequest'
      responses:
        '200':
          description: キャンセル済み
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '409':
          description: 状態、version、冪等性の競合
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          description: token期限切れまたは使用済み
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /inquiries:
    post:
      tags: [Inquiries]
      operationId: createInquiry
      summary: 問い合わせ受付
      description: |
        DBへ保存後、受付メールと店舗通知をoutboxへ登録する。reservationCodeを指定する場合、
        ログイン会員は自分の予約であること、guestはview目的の`X-Guest-Token`が対象予約に
        有効であることを検証する。問い合わせへの利用ではview tokenを消費しない。
      security:
        - {}
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfTokenOptional'
        - $ref: '#/components/parameters/GuestTokenOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryCreateRequest'
      responses:
        '202':
          description: 受付済み。メールは送信待ちまたは送信中
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 冪等キーの異なるbodyでの再利用
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                idempotencyKeyReused:
                  $ref: '#/components/examples/IdempotencyKeyReused'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/members/register:
    post:
      tags: [Auth]
      operationId: registerMember
      summary: 会員登録
      description: |
        marketingPreferenceは任意で、新規account作成時だけappend-only evidenceへ反映する。
        登録済みemailへの再送では既存accountの同意・抑止状態を変更せず、列挙防止の同一202応答を返す。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRegistrationRequest'
      responses:
        '202':
          description: 登録済みemailを含め常に同じ受付応答を返し、アカウント有無を開示しない
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: 同じ冪等キーを異なるbodyで再利用した場合だけ返す
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                idempotencyKeyReused:
                  $ref: '#/components/examples/IdempotencyKeyReused'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/sessions:
    post:
      tags: [Auth]
      operationId: createSession
      summary: ログイン
      description: |
        `authMode=cookie` はSecure/HttpOnly/SameSite Cookieを設定する。
        `authMode=bearer` は短寿命JWTをbodyで返す。スタッフと会員に共通。
        staffのpassword認証直後はAAL1であり、MFA verify後まで管理APIは403にする。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 認証成功
          headers:
            Set-Cookie:
              description: authMode=cookie の場合のみ返却
