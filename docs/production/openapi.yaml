        reason:
          type: [string, "null"]
        externalReference:
          type: [string, "null"]
        recordedByEmployeeCode:
          type: [string, "null"]
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    PaymentTransactionResponse:
