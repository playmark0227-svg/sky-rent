      tags: [Auth]
      operationId: enrollMfaFactor
      summary: staff用TOTP factorを登録開始
      description: |
        Supabase AuthのMFA enrollへ委譲する。AAL1のstaff sessionだけが利用できる。
        secretとQR URIはこの応答で一度だけ返し、保存・access log出力を禁止する。
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollRequest'
      responses:
        '201':
          description: 未検証factorを作成
          headers:
            Cache-Control:
              description: secretを保存しない
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/mfa/challenges:
    post:
      tags: [Auth]
      operationId: createMfaChallenge
      summary: TOTP challengeを作成
      description: Supabase AuthのMFA challengeへ委譲する。challengeは短命かつ一回限り。
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaChallengeRequest'
      responses:
        '201':
          description: challenge作成済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallengeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/mfa/challenges/{challengeId}/verify:
    parameters:
      - $ref: '#/components/parameters/MfaChallengeIdPath'
    post:
      tags: [Auth]
      operationId: verifyMfaChallenge
      summary: TOTP codeを検証してAAL2へ昇格
      description: |
        Supabase AuthのMFA verifyへ委譲し、成功時にAAL2 session/JWTへrotationする。
        password認証直後のAAL1 tokenをAAL2とみなしてはならない。
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: AAL2 session発行済み
          headers:
            Set-Cookie:
              description: cookie modeの場合だけAAL2 sessionへ更新
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: challenge期限切れまたは使用済み
          content:
            application/problem+json:
              schema:
