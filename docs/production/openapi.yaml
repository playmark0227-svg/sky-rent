    PaymentTransactionCreateRequest:
      type: object
      additionalProperties: false
      required: [transactionType, direction, tender, amount, currency, occurredAt]
      properties:
        transactionType:
          $ref: '#/components/schemas/PaymentTransactionType'
        direction:
          $ref: '#/components/schemas/PaymentBalanceDirection'
        amount:
          type: integer
          minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        tender:
          $ref: '#/components/schemas/PaymentTender'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        externalReference:
          type: [string, "null"]
          maxLength: 200
        reason:
          type: [string, "null"]
          maxLength: 1000
      description: |
        追記専用。既存transactionを更新・削除しない。paymentはincrease_paid、
        refundはdecrease_paidに固定し、adjustmentだけ両方向を許可してreasonを必須にする。
      oneOf:
        - required: [transactionType, direction]
          properties:
            transactionType:
              const: payment
            direction:
              const: increase_paid
        - required: [transactionType, direction]
          properties:
            transactionType:
              const: refund
            direction:
              const: decrease_paid
        - required: [transactionType, direction, reason]
          properties:
            transactionType:
              const: adjustment
            direction:
              $ref: '#/components/schemas/PaymentBalanceDirection'
            reason:
              type: string
              minLength: 1
              maxLength: 1000
    PaymentTransaction:
      type: object
      additionalProperties: false
      description: |
        追記専用決済台帳。paid balanceはincrease_paidの合計からdecrease_paidの合計を引いて導出する。
      required: [paymentTransactionId, parentType, parentCode, transactionType, direction, tender, amount, currency, occurredAt, createdAt]
      properties:
        paymentTransactionId:
