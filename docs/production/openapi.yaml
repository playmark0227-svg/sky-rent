            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: preference状態を共有cacheへ保存しない
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingPreferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: member以外のaccount
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags: [Me, Marketing]
      operationId: replaceMyMarketingPreference
      summary: 自分の広告メール同意を更新
      description: |
        optedIn=trueはopted_in、falseかつ過去opt-inなしはdeclined、過去opt-inありはwithdrawn eventを
        append-onlyで記録する。同じversion・同じ希望状態の再送はeventを重複させず現在状態を返す。
        withdrawn時はemail destination hashのsuppressionを有効化するが、declinedだけでは抑止rowを作らない。
        opted_inへ戻してもbounce、complaint、manual、legal suppressionは自動解除しない。
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfTokenOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingPreferenceInput'
      responses:
        '200':
          description: 同意・配信抑止状態更新済み
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingPreferenceResponse'
        '401':
