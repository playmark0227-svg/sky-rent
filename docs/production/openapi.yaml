          maxLength: 200
        line2:
          type: [string, "null"]
          maxLength: 200
    BusinessHourSlot:
      type: object
      additionalProperties: false
      description: 営業枠はlocal timeで0時間超24時間未満。closesNextDay=falseで同時刻または逆転する値をserverが拒否する。
      required: [closed, closesNextDay]
      properties:
        closed:
          type: boolean
        opensAt:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        closesAt:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        closesNextDay:
          type: boolean
      allOf:
        - if:
            properties:
              closed:
                const: false
          then:
            required: [opensAt, closesAt]
            properties:
              opensAt:
                type: string
                pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
              closesAt:
                type: string
                pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        - if:
            properties:
              closed:
                const: true
          then:
            properties:
              closesNextDay:
                const: false
            not:
              anyOf:
                - required: [opensAt]
                  properties:
                    opensAt:
                      type: string
                      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                - required: [closesAt]
                  properties:
                    closesAt:
                      type: string
                      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    BusinessDayHours:
      type: array
      minItems: 1
      maxItems: 8
      description: 同一曜日の複数営業時間帯。休業日はclosed=trueの1枠だけを指定する。
      items:
        $ref: '#/components/schemas/BusinessHourSlot'
      allOf:
        - if:
            contains:
              required: [closed]
              properties:
                closed:
                  const: true
          then:
            minItems: 1
            maxItems: 1
