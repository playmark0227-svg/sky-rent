    AuditActorType:
      type: string
      enum: [anonymous, member, staff, system, import]
    AuditResult:
      type: string
      enum: [success, denied, failed]
    AuditEvent:
      type: object
      additionalProperties: false
      required: [auditEventId, occurredAt, action, resourceType, actor, result, requestId]
      properties:
        auditEventId:
          type: string
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        action:
          type: string
          pattern: '^[a-z][a-z0-9_.:-]*$'
        resourceType:
          type: string
        resourceCode:
          type: [string, "null"]
        actor:
          type: object
          additionalProperties: false
          required: [actorType, actorCode, roleSnapshot, systemJobId, importRunId]
          properties:
            actorType:
              $ref: '#/components/schemas/AuditActorType'
            actorCode:
              type: [string, "null"]
              description: member/staffの記録時code snapshot。actor FK削除後も保持する。
            roleSnapshot:
              oneOf:
                - $ref: '#/components/schemas/StaffRole'
                - type: "null"
            systemJobId:
              type: [string, "null"]
            importRunId:
              type: [string, "null"]
          oneOf:
            - required: [actorType, actorCode, roleSnapshot, systemJobId, importRunId]
              properties:
                actorType:
                  const: anonymous
                actorCode:
                  type: "null"
                roleSnapshot:
                  type: "null"
                systemJobId:
                  type: "null"
                importRunId:
                  type: "null"
            - required: [actorType, actorCode, roleSnapshot, systemJobId, importRunId]
              properties:
                actorType:
                  const: member
                actorCode:
                  type: string
                  minLength: 1
                roleSnapshot:
                  type: "null"
                systemJobId:
                  type: "null"
                importRunId:
                  type: "null"
            - required: [actorType, actorCode, roleSnapshot, systemJobId, importRunId]
              properties:
                actorType:
                  const: staff
                actorCode:
                  type: string
                  minLength: 1
                roleSnapshot:
                  $ref: '#/components/schemas/StaffRole'
                systemJobId:
                  type: "null"
                importRunId:
                  type: "null"
            - required: [actorType, actorCode, roleSnapshot, systemJobId, importRunId]
              properties:
                actorType:
                  const: system
                actorCode:
                  type: "null"
                roleSnapshot:
                  type: "null"
                systemJobId:
                  type: string
                  minLength: 1
                importRunId:
                  type: "null"
            - required: [actorType, actorCode, roleSnapshot, systemJobId, importRunId]
              properties:
                actorType:
                  const: import
                actorCode:
                  type: "null"
                roleSnapshot:
                  type: "null"
                systemJobId:
                  type: "null"
                importRunId:
                  type: string
                  minLength: 1
        result:
          $ref: '#/components/schemas/AuditResult'
        locationCode:
          type: [string, "null"]
        requestId:
          type: string
        reason:
          type: [string, "null"]
        changes:
          type: object
          description: 秘密情報と認証情報を除き、PIIをマスクした変更前後差分。
          additionalProperties: true
    AuditEventListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        meta:
          $ref: '#/components/schemas/PageMeta'
