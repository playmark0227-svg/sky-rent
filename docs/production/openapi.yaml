components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sky_rent_session
      description: |
        Secure / HttpOnly / SameSite=Lax の不透明セッションCookie。
        Cookie認証による変更操作には `X-CSRF-Token` も必要。
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        短寿命JWT。`sub`、`accountType`、`aal`、`role`、`permissions`、
        `locationScopes`、`exp`、`jti`を含む。管理APIは`aal=aal2`必須。
        role/permission/scope claimはhintであり、最新DB状態を毎回再検証する。

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: 表示名の優先言語。未指定時は `ja`。
      schema:
        type: string
        enum: [ja, en]
        default: ja
    Cursor:
      name: cursor
      in: query
      required: false
      description: 前回応答の `meta.nextCursor`。内容を解釈しない不透明値。
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CategoryCodeQuery:
      name: categoryCode
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ResourceCode'
    LocationCodeQuery:
      name: locationCode
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ResourceCode'
    ReportingYearQuery:
      name: reportingYear
      in: query
      required: true
      description: 年度の終了年。例として2026は2025-04-01から2026-03-31までを表す。
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        同一主体・同一endpointで24時間以上一意なキー。同じキーと同じ正規化bodyは
        最初の応答を再生し、異なるbodyは `409 IDEMPOTENCY_KEY_REUSED`。
        anonymous clientもbootstrap CookieなしでmutationごとにUUIDv4または16 random bytes以上の
        base64url keyを生成する。serverはactor scopeとkeyをkey-id付きHMAC化し、raw値を保存しない。
      schema:
        type: string
        minLength: 22
        maxLength: 255
        pattern: '^[A-Za-z0-9._:-]+$'
      example: 7b1d4b2f-6f8a-4d53-b3a2-0b9d14781c21
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: 指定時は必須版と同じ冪等性規則を適用する。
      schema:
        type: string
        minLength: 22
        maxLength: 255
        pattern: '^[A-Za-z0-9._:-]+$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: "取得時のETag。古い値は `409 VERSION_CONFLICT`、欠落は `428`。"
      schema:
        type: string
        pattern: '^(W/)?"[^"\\]+"$'
      example: '"7"'
    CsrfTokenOptional:
      name: X-CSRF-Token
      in: header
      required: false
      description: Cookie認証を使う変更系操作では必須。Bearer認証では送信しない。
      schema:
        type: string
        minLength: 32
        maxLength: 512
    GuestToken:
      name: X-Guest-Token
      in: header
      required: true
      description: purpose別guest token。viewはexpiryまで再利用可、cancelはatomicに一回使用。URL・logへ記録しない。
      schema:
        type: string
        minLength: 32
        maxLength: 2048
    GuestTokenOptional:
      name: X-Guest-Token
      in: header
      required: false
      description: 未認証でreservationCodeを問い合わせへ紐付ける場合はview token必須。検証しても消費しない。
      schema:
        type: string
        minLength: 32
        maxLength: 2048
    XAccessReason:
      name: X-Access-Reason
      in: header
      required: true
      description: sensitive PII参照の業務上の理由。監査記録へ保存し、PII自体は含めない。
      schema:
        type: string
        minLength: 3
        maxLength: 500
    MarketingUnsubscribeToken:
      name: X-Marketing-Unsubscribe-Token
      in: header
      required: true
      description: |
        広告メール配信停止だけに使える高entropy token。landing URLのfragmentからJSがこのheaderへ移す。
        HTTP request URL/query、Referrer、通常DB列、request/access log、analyticsへ原文を保存せず、
        server secret付きhashで照合する。同じtokenの再送は同じ抑止状態を返す。
      schema:
        type: string
        minLength: 32
        maxLength: 2048
    AssetCodePath:
      name: assetCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceCode'
    ReservationCodePath:
      name: reservationCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^R[0-9]{8}-[A-Z0-9]{8,26}$'
    CategoryCodePath:
      name: categoryCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceCode'
    LocationCodePath:
      name: locationCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceCode'
    OptionCodePath:
      name: optionCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceCode'
    MemberCodePath:
      name: memberCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^M[A-Z0-9]{8,26}$'
    InvoiceCodePath:
      name: invoiceCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^INV-[0-9]{8}-[A-Z0-9]{4,26}$'
    InquiryCodePath:
      name: inquiryCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^I[A-Z0-9]{8,26}$'
    EmployeeCodePath:
      name: employeeCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^E[A-Z0-9]{6,26}$'
    MfaChallengeIdPath:
      name: challengeId
      in: path
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 255
    PricingRevisionCodePath:
      name: pricingRevisionCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^PR[A-Z0-9]{6,26}$'
    RatePlanCodePath:
      name: ratePlanCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^RP[A-Z0-9]{6,26}$'
    HighSeasonCodePath:
      name: highSeasonCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceCode'
    ClosureCodePath:
      name: closureCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^LC[A-Z0-9]{6,26}$'
    MaintenanceBlockCodePath:
      name: maintenanceBlockCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^MB[A-Z0-9]{6,26}$'
    FilingCodePath:
      name: filingCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^RF[A-Z0-9]{6,26}$'

  headers:
    ETag:
      description: 現在の `rowVersion` を表す強いETag。更新時に `If-Match` へ渡す。
      schema:
        type: string
      example: '"7"'
    IdempotencyReplayed:
      description: 保存済み応答を再生した場合に `true`。初回は `false`。
      schema:
        type: boolean
      example: false

  responses:
    BadRequest:
      description: JSON構文、query、header、日時形式が不正
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            badRequest:
              value:
                type: https://api.example.com/problems/bad-request
                title: Bad request
                status: 400
                code: BAD_REQUEST
                detail: リクエストを解釈できません。
                requestId: req_01J8ABC
    Unauthorized:
      description: 認証情報がない、期限切れ、または無効
      headers:
        WWW-Authenticate:
          description: Bearer認証のチャレンジ
          schema:
            type: string
          example: Bearer realm="sky-rent"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            unauthorized:
              value:
                type: https://api.example.com/problems/unauthorized
                title: Authentication required
                status: 401
                code: UNAUTHORIZED
                detail: ログインしてください。
                requestId: req_01J8ABC
    Forbidden:
      description: 認証済みだがAAL2、権限、または担当拠点が不足
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            forbidden:
              value:
                type: https://api.example.com/problems/forbidden
                title: Forbidden
                status: 403
                code: FORBIDDEN
                detail: この操作を実行する権限がありません。
                requestId: req_01J8ABC
            aal2Required:
              value:
                type: https://api.example.com/problems/aal2-required
                title: MFA verification required
                status: 403
                code: AAL2_REQUIRED
                detail: 管理操作の前にMFAを完了してください。
                requestId: req_01J8ABC
    NotFound:
      description: リソースが存在しない、または閲覧できない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            notFound:
              value:
                type: https://api.example.com/problems/not-found
                title: Not found
                status: 404
                code: NOT_FOUND
                detail: 対象が見つかりません。
                requestId: req_01J8ABC
    Conflict:
      description: 一意制約、状態遷移、業務ルールの競合
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            conflict:
              value:
                type: https://api.example.com/problems/conflict
                title: Conflict
                status: 409
                code: CONFLICT
                detail: 現在の状態では操作できません。
                requestId: req_01J8ABC
    VersionConflict:
      description: "`If-Match` と現在のバージョンが不一致"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            versionConflict:
              $ref: '#/components/examples/VersionConflict'
    UnprocessableEntity:
      description: JSON Schemaまたは業務入力検証に失敗
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            validationFailed:
              value:
                type: https://api.example.com/problems/validation-failed
                title: Validation failed
                status: 422
                code: VALIDATION_FAILED
                detail: 入力内容を確認してください。
                requestId: req_01J8ABC
                errors:
                  - pointer: /endAt
                    code: MUST_BE_AFTER_START_AT
                    message: endAt は startAt より後にしてください。
    PreconditionRequired:
      description: 更新・状態変更に必要な `If-Match` がない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            preconditionRequired:
              value:
                type: https://api.example.com/problems/precondition-required
                title: Precondition required
                status: 428
                code: IF_MATCH_REQUIRED
                detail: If-Match ヘッダーを指定してください。
                requestId: req_01J8ABC
    TooManyRequests:
      description: レート制限超過
      headers:
        Retry-After:
          description: 再試行までの秒数
          schema:
            type: integer
            minimum: 1
          example: 30
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            rateLimited:
              value:
                type: https://api.example.com/problems/rate-limited
                title: Too many requests
                status: 429
                code: RATE_LIMITED
                detail: しばらく待ってから再試行してください。
                requestId: req_01J8ABC

  examples:
    IdempotencyKeyReused:
      value:
        type: https://api.example.com/problems/idempotency-key-reused
        title: Idempotency key reused
        status: 409
        code: IDEMPOTENCY_KEY_REUSED
        detail: 同じIdempotency-Keyが異なるリクエスト内容で使用されました。
        requestId: req_01J8ABC
    AvailabilityConflict:
      value:
        type: https://api.example.com/problems/availability-conflict
        title: Vehicle no longer available
        status: 409
        code: AVAILABILITY_CONFLICT
        detail: 指定期間の在庫が不足しています。空き状況を再検索してください。
        requestId: req_01J8ABC
        conflict:
          resourceType: asset
          resourceCode: V001
          currentAvailability: 0
    QuoteStale:
      value:
        type: https://api.example.com/problems/quote-stale
        title: Quote is stale
        status: 409
        code: QUOTE_STALE
        detail: 料金または選択内容が変更されています。見積りを再作成してください。
        requestId: req_01J8ABC
        conflict:
          expectedPricingRevision: pricing-42
          actualPricingRevision: pricing-43
    CouponUnavailable:
      value:
        type: https://api.example.com/problems/coupon-unavailable
        title: Coupon unavailable
        status: 409
        code: COUPON_UNAVAILABLE
        detail: クーポンは使用済み、期限切れ、または対象外です。
        requestId: req_01J8ABC
    QuoteExpired:
      value:
        type: https://api.example.com/problems/quote-expired
        title: Quote expired
        status: 410
        code: QUOTE_EXPIRED
        detail: 見積りの有効期限が切れました。
        requestId: req_01J8ABC
    InvalidStatusTransition:
      value:
        type: https://api.example.com/problems/invalid-status-transition
        title: Invalid status transition
        status: 409
        code: INVALID_STATUS_TRANSITION
        detail: returned から cancelled へは変更できません。
        requestId: req_01J8ABC
        conflict:
          currentStatus: returned
          requestedStatus: cancelled
    VersionConflict:
      value:
        type: https://api.example.com/problems/version-conflict
        title: Version conflict
        status: 409
        code: VERSION_CONFLICT
        detail: 対象は別の操作で更新されています。再取得してからやり直してください。
        requestId: req_01J8ABC
        conflict:
          expectedVersion: 6
          actualVersion: 7

  schemas:
    ResourceCode:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
    Timestamp:
      type: string
      format: date-time
      examples: ['2026-09-16T08:00:00Z']
    LegalDocument:
      type: object
      additionalProperties: false
      required: [documentType, version, language, contentHash, publishedAt, effectiveAt, uri]
      properties:
        documentType:
          type: string
          enum: [rental_terms, pricing, privacy, cancellation, commercial_disclosure, external_transmission, marketing, site_terms, accessibility]
        version:
          type: string
          minLength: 1
          maxLength: 100
        language:
          type: string
          description: 公開本文のBCP 47言語tag。日本語正本は `ja-JP`。
          pattern: '^[a-z]{2}(?:-[A-Z]{2})?$'
          examples: [ja-JP]
        contentHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        effectiveAt:
          $ref: '#/components/schemas/Timestamp'
        uri:
          type: string
          format: uri
    LegalDocumentListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LegalDocument'
          minItems: 5
          maxItems: 9
          description: rental_terms、pricing、privacy、cancellation、commercial_disclosureは常に含む。external_transmission、marketing、site_terms、accessibilityは適用・公開時に含む。
    MarketingPreferenceInput:
      type: object
      additionalProperties: false
      required: [marketingVersion, optedIn]
      description: |
        任意の広告メール同意。親requestでこのobject自体を省略した場合はeventを作らず、opt-inとも扱わない。
        optedIn=trueはopted_in、falseかつ過去opt-inなしはdeclined、過去opt-inありはwithdrawn eventを
        append-onlyで記録する。同じ業務requestの冪等再送や同じmember stateへのPUTはeventを重複させない。
      properties:
        marketingVersion:
          type: string
          description: "`/legal-documents/current` の documentType=marketing のversion。"
          minLength: 1
          maxLength: 100
        optedIn:
          type: boolean
    MarketingEvidenceKind:
      type: string
      enum: [opted_in, declined, withdrawn]
    MarketingPreferenceSource:
      type: string
      enum: [reservation, member_registration, inquiry, member_settings, unsubscribe, import]
    MarketingPreferenceEvent:
      type: object
      additionalProperties: false
      description: immutableなappend-only evidence。更新・削除せず、訂正は新しいeventを追記する。
      required: [preferenceEventCode, evidenceKind, marketingVersion, source, occurredAt, evidenceHash, requestId]
      properties:
        preferenceEventCode:
          type: string
          pattern: '^MPE[A-Z0-9]{6,26}$'
        evidenceKind:
          $ref: '#/components/schemas/MarketingEvidenceKind'
        marketingVersion:
          type: string
          minLength: 1
          maxLength: 100
        source:
          $ref: '#/components/schemas/MarketingPreferenceSource'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        evidenceHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        requestId:
          type: string
          minLength: 1
          maxLength: 255
    MarketingSuppressionReason:
      type: string
      enum: [withdrawn, unsubscribe, bounce, complaint, manual, legal]
    MarketingSuppression:
      type: object
      additionalProperties: false
      description: email destination hashに対する現在有効な配信抑止。宛先原文は返さない。
      required: [suppressed, reason, suppressedAt]
      properties:
        suppressed:
          type: boolean
        reason:
          oneOf:
            - $ref: '#/components/schemas/MarketingSuppressionReason'
            - type: "null"
        suppressedAt:
          type: [string, "null"]
          format: date-time
      oneOf:
        - required: [suppressed, reason, suppressedAt]
          properties:
            suppressed:
              const: false
            reason:
              type: "null"
            suppressedAt:
              type: "null"
        - required: [suppressed, reason, suppressedAt]
          properties:
            suppressed:
              const: true
            reason:
              $ref: '#/components/schemas/MarketingSuppressionReason'
            suppressedAt:
              type: string
              format: date-time
    MarketingPreference:
      type: object
      additionalProperties: false
      description: latest append-only eventとactive suppressionから導出した広告メール状態。
      required: [optedIn, eligible, marketingVersion, latestEvent, suppression, rowVersion]
      properties:
        optedIn:
          type: boolean
        eligible:
          type: boolean
          description: optedIn=trueかつactive suppressionなしの場合だけtrue。送信時にも再評価する。
        marketingVersion:
          type: [string, "null"]
          maxLength: 100
        latestEvent:
          oneOf:
            - $ref: '#/components/schemas/MarketingPreferenceEvent'
            - type: "null"
        suppression:
          $ref: '#/components/schemas/MarketingSuppression'
        rowVersion:
          $ref: '#/components/schemas/RowVersion'
