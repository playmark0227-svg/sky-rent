      operationId: getMyMarketingPreference
      summary: 自分の広告メール同意・配信抑止状態を取得
      description: 最新のappend-only preference eventとactive suppressionからserverが導出した状態を返す。
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: 現在の広告メール同意・配信抑止状態
