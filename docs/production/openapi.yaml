    StatutoryReportGenerateRequest:
      type: object
      additionalProperties: false
      required: [reportingYear, locationCodes, formVersion, templateContentHash, reasonCode]
      properties:
        reportingYear:
          type: integer
          description: 年度の終了年。例として2026は2025-04-01から2026-03-31まで。
          minimum: 2000
          maximum: 2100
        locationCodes:
          type: array
          description: 生成対象の完全性確認用。serverがreportingYearと管轄確認済み様式に基づき、対象期間/基準日の実効日付き履歴から算出した全報告対象事務所codeと完全一致させる。欠落・余分・権限不足は副作用なしで拒否する。
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceCode'
        formVersion:
          type: string
          description: 管轄運輸支局へ確認した現行の提出様式version。推測値を使わない。
          minLength: 1
          maxLength: 100
        templateContentHash:
          type: string
          description: 承認済み提出template原本のhash。
          pattern: '^sha256:[a-f0-9]{64}$'
        reasonCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        reasonText:
          type: [string, "null"]
          maxLength: 1000
    RegulatoryFilingType:
      type: string
      enum: [annual_rental_performance, office_vehicle_count]
    RegulatoryFilingStatus:
      type: string
      enum: [generated, submitted, accepted, rejected]
    RegulatoryFiling:
      type: object
      additionalProperties: false
      required:
        - filingCode
        - filingType
        - status
        - reportingYear
        - formVersion
        - templateContentHash
        - reportDataHash
        - reportDataUri
        - recipientAuthority
        - reportingStart
        - reportingEnd
        - asOfDate
        - fileHash
        - fileUri
        - generatedAt
        - submittedAt
        - acceptedAt
        - submissionChannel
        - submissionReference
        - result
        - rowVersion
      properties:
        filingCode:
          type: string
          pattern: '^RF[A-Z0-9]{6,26}$'
        filingType:
          $ref: '#/components/schemas/RegulatoryFilingType'
        status:
          $ref: '#/components/schemas/RegulatoryFilingStatus'
        reportingYear:
          type: integer
          minimum: 2000
          maximum: 2100
        formVersion:
          type: string
          minLength: 1
          maxLength: 100
        templateContentHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        reportDataHash:
          type: string
          description: 生成時に固定した集計snapshotのhash。
          pattern: '^sha256:[a-f0-9]{64}$'
        reportDataUri:
          type: string
          description: hash対象のcanonical集計snapshotを保持するimmutable URI。
          format: uri
        recipientAuthority:
          type: string
          description: 生成時の主たる事務所所在地からserverが確定した、提出先の管轄運輸支局長snapshot。
          minLength: 1
          maxLength: 300
        reportingStart:
          type: [string, "null"]
          format: date
        reportingEnd:
          type: [string, "null"]
          format: date
        asOfDate:
          type: [string, "null"]
          format: date
        fileHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        fileUri:
          type: string
          format: uri
        generatedAt:
          $ref: '#/components/schemas/Timestamp'
        submittedAt:
          type: [string, "null"]
          format: date-time
        acceptedAt:
          type: [string, "null"]
          format: date-time
        submissionChannel:
          type: [string, "null"]
          maxLength: 100
        submissionReference:
          type: [string, "null"]
          maxLength: 500
        result:
          type: [string, "null"]
          maxLength: 2000
        rowVersion:
          $ref: '#/components/schemas/RowVersion'
    RegulatoryFilingResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RegulatoryFiling'
    RegulatorySubmissionRequest:
      type: object
      additionalProperties: false
      required: [status, channel, submittedAt, reference, result]
      properties:
        status:
          type: string
          enum: [submitted, accepted, rejected]
        channel:
          type: string
          minLength: 1
          maxLength: 100
        submittedAt:
          $ref: '#/components/schemas/Timestamp'
        acceptedAt:
          type: [string, "null"]
          format: date-time
        reference:
          type: string
          minLength: 1
          maxLength: 500
        result:
          type: string
          minLength: 1
          maxLength: 2000
      allOf:
        - if:
            properties:
              status:
                const: accepted
          then:
            required: [acceptedAt]
            properties:
              acceptedAt:
                type: string
                format: date-time
        - if:
            properties:
              status:
                enum: [submitted, rejected]
          then:
            properties:
              acceptedAt:
                type: "null"

