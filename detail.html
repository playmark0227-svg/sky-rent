<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詳細・ご予約 | グロースレンタカー</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/public.css">
  <style>
    #d-image img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .dt-reason { font-size: 12.5px; line-height: 1.8; color: #ffb4a8; margin-top: 6px; }
    .dt-check { font-size: 12px; color: var(--color-muted); margin-top: 6px; }
    .dt-suggest { margin-top: 10px; }
    .dt-suggest p { font-size: 12.5px; color: var(--color-muted); margin-bottom: 6px; }
    .dt-suggest button { display: block; width: 100%; text-align: left; margin-top: 6px; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--ink); color: #fff; font-family: inherit; font-size: 12.5px; cursor: pointer; }
    .dt-suggest button:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .opt-row .on small { display: block; font-size: 11.5px; color: var(--color-muted); line-height: 1.6; font-weight: 400; }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="images/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
  <meta property="og:site_name" content="グロースレンタカー">
  <meta property="og:type" content="website">
  <meta property="og:title" content="詳細・ご予約 | グロースレンタカー">
  <meta property="og:description" content="北海道 北見・釧路のレンタカー・キッチンカー。空き状況を検索して、Webでそのまま予約できます。">
  <meta property="og:url" content="https://playmark0227-svg.github.io/sky-rent/detail.html">
  <meta property="og:image" content="https://playmark0227-svg.github.io/sky-rent/images/brand/og-image.png">

</head>
<body>
  <header class="site-header solid">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="グロースレンタカー トップページへ"><picture><source media="(max-width: 480px)" srcset="images/brand/logo-mark-white.png" width="800" height="249"><img class="logo-img" src="images/brand/logo-horizontal-white.png" alt="グロースレンタカー" width="1400" height="196"></picture></a>
      <nav class="site-nav">
        <a href="index.html#categories" data-i18n="nav.categories" class="nav-hide-sp">カテゴリ</a>
        <a href="index.html#locations" data-i18n="nav.locations" class="nav-hide-sp">店舗一覧</a>
        <a href="mypage.html" data-i18n="nav.mypage">マイページ</a>
        <a href="search.html" class="nav-cta" data-i18n="nav.search">予約する</a>
        <button class="lang-btn" data-lang-toggle type="button">EN</button>
      </nav>
    </div>
  </header>

  <main class="container page-offset" style="padding-bottom:60px">
    <div class="steps">
      <span class="step done"><span class="n">1</span><span data-sk="s1">検索</span></span>
      <span class="sep">›</span>
      <span class="step active"><span class="n">2</span><span data-sk="s2">車両を選択</span></span>
      <span class="sep">›</span>
      <span class="step"><span class="n">3</span><span data-sk="s3">情報入力</span></span>
      <span class="sep">›</span>
      <span class="step"><span class="n">4</span><span data-sk="s4">完了</span></span>
    </div>

    <p class="muted mb16" id="crumb" style="font-size:12px"></p>
    <div id="notfound" hidden class="p-card tc"><p class="muted">対象が見つかりませんでした。</p><a href="search.html" class="btn btn-primary mt16" data-i18n="detail.back">検索結果へ戻る</a></div>

    <div class="detail-grid" id="detail-grid" hidden>
      <!-- 左: 詳細 -->
      <div>
        <div class="p-card">
          <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
            <div id="d-image" style="width:230px;max-width:100%;aspect-ratio:16/10;border-radius:8px;overflow:hidden;position:relative;background:linear-gradient(140deg,var(--ink),var(--ink-2));display:flex;align-items:center;justify-content:center;font-size:54px;flex-shrink:0">📦</div>
            <div style="flex:1;min-width:220px">
              <div class="muted" id="d-cat" style="font-family:var(--font-num);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px"></div>
              <h1 style="font-family:var(--font-serif);font-size:26px;line-height:1.5" id="d-name"></h1>
              <div class="muted mt8" id="d-loc" style="font-size:13px"></div>
            </div>
          </div>
          <div id="d-license"></div>
          <h3 class="mt24 mb8" data-i18n="detail.specs" style="font-size:15px">スペック・装備</h3>
          <table class="spec-table" id="d-specs"></table>
        </div>

        <div class="p-card mt16">
          <h3 style="font-size:15px" id="price-title">料金プラン</h3>
          <table class="spec-table mt8" id="d-plans"></table>
          <p class="muted mt8" id="d-plan-note" style="font-size:12px;line-height:1.8"></p>
        </div>

        <a href="search.html" class="btn btn-secondary mt16" id="back-btn" data-i18n="detail.back">← 検索結果へ戻る</a>
      </div>

      <!-- 右: 予約パネル -->
      <div class="detail-side">
        <div class="p-card">
          <h3 style="font-size:16px" data-i18n="detail.estimate">料金見積り</h3>
          <div class="fg mt16" style="display:flex;flex-direction:column;gap:6px">
            <label class="muted" for="p-start" style="font-size:12px;font-weight:700" data-i18n="search.start">出発日時 (受取)</label>
            <input type="datetime-local" id="p-start" style="padding:9px 10px;border:1px solid var(--color-border);border-radius:6px;font-family:inherit">
          </div>
          <div class="fg mt8" style="display:flex;flex-direction:column;gap:6px">
            <label class="muted" for="p-end" style="font-size:12px;font-weight:700" data-i18n="search.end">返却日時</label>
            <input type="datetime-local" id="p-end" style="padding:9px 10px;border:1px solid var(--color-border);border-radius:6px;font-family:inherit">
          </div>
          <p class="muted" id="p-tz" style="font-size:11.5px;margin-top:6px">日時は日本時間です。</p>
          <div class="fg mt8" id="qty-wrap" style="display:none;flex-direction:column;gap:6px">
            <label class="muted" style="font-size:12px;font-weight:700" data-i18n="detail.quantity">数量</label>
            <select id="p-qty" style="padding:9px 10px;border:1px solid var(--color-border);border-radius:6px;font-family:inherit"></select>
          </div>

          <div id="opt-area" class="mt8"></div>

          <div class="price-box mt16">
            <div class="price-lines" id="p-lines"></div>
            <div class="price-total"><span data-i18n="detail.total">合計 (税込)</span><span class="amt" id="p-total">¥0</span></div>
          </div>
          <p class="muted mt8" id="p-discount-note" style="font-size:12px"></p>
          <div class="mt8" id="p-avail"></div>
          <div id="p-reason" class="dt-reason" hidden></div>
          <div id="p-check" class="dt-check" hidden></div>
          <div id="p-suggest" class="dt-suggest" hidden></div>
          <button class="btn btn-primary btn-lg mt16" id="book-btn" style="width:100%" data-i18n="detail.book">この内容で予約に進む</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer"><div class="container"><div class="footer-bottom" style="border-top:none"><span data-i18n="footer.copyright">© 2026 グロースレンタカー</span><a href="index.html">← トップへ戻る</a></div></div></footer>

  <script src="js/pricing.js?v=20260923"></script>
  <script src="js/i18n.js?v=20260923"></script>
  <script src="js/api.js?v=20260923"></script>

  <script src="js/backend.js?v=20260923"></script>

  <script type="text/x-deferred">
  (function () {
    'use strict';
    const S = window.SkyRentStore, I = window.SkyRentI18n, P = window.SkyRentPricing, B = window.SkyRentBackend;
    const core = window.SkyRentPricingCore;
    const J = B.jst;
    const $ = s => document.querySelector(s);
    function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    const isEn = () => I.getLang() === 'en';
    const catName = c => c && isEn() && c.nameEn ? c.nameEn : (c ? c.name : '');
    const assetName = a => isEn() && a.nameEn ? a.nameEn : a.name;
    const yen = n => P.yen(n);
    const MIN = 60000, HOUR = 3600000, DAY = 86400000, JST = 9 * HOUR;
    const PENDING_KEY = 'sky-rent.pendingBooking';

    const L = {
      s1:{ja:'検索',en:'Search'}, s2:{ja:'車両を選択',en:'Select'}, s3:{ja:'情報入力',en:'Details'}, s4:{ja:'完了',en:'Done'},
      plans:{ja:'料金プラン',en:'Pricing'},
      ph:{ja:'1時間ごと',en:'Per hour'}, pd:{ja:'24時間',en:'Per 24 hours'}, pw:{ja:'週貸し (7日〜)',en:'Weekly (7d+)'}, pm:{ja:'月貸し (30日〜)',en:'Monthly (30d+)'},
      cap:{ja:'定員',en:'Capacity'}, plate:{ja:'ナンバー',en:'Plate'}, stock:{ja:'在庫数',en:'Stock'}, loc:{ja:'取扱拠点',en:'Location'}, cat:{ja:'カテゴリ',en:'Category'},
      avOk:{ja:'ご予約いただけます',en:'Available'}, avNg:{ja:'この日時はご予約いただけません',en:'Not available for this period'},
      stockLeft:{ja:n=>'残り '+n,en:n=>n+' left'},
      invalid:{ja:'貸出日時と返却日時を入力してください (返却は貸出より後の日時)。',en:'Please set a valid period.'},
      past:{ja:'過去の日時はご予約いただけません。出発日時をご確認ください。',en:'The pick-up time is in the past.'},
      checking:{ja:'空き状況を確認しています…',en:'Checking availability…'},
      checked:{ja:'空き状況を確認しました。',en:'Availability confirmed.'},
      checkFailed:{ja:'空き状況を確認できませんでした。ご予約の確定時にあらためて確認します。',en:'Could not check availability now. It will be checked again when you confirm.'},
      suggest:{ja:'ご希望に近い、ご予約いただける日時 (同じ利用時間):',en:'Nearby available times (same duration):'},
      discountNote:{ja:'学生・法人などの割引は、次の画面で選べます。',en:'Discounts can be selected on the next page.'},
      perDay:{ja:'/24時間',en:'/24h'}, perRental:{ja:'/1回',en:'/booking'}
    };
    const tt = k => L[k][isEn()?'en':'ja'];

    const params = new URLSearchParams(location.search);
    const asset = S.getAsset(params.get('id'));
    let cat, options = { common: [], specific: [] };
    let selectedOptions = [];

    if (!asset) { document.addEventListener('DOMContentLoaded', () => { $('#notfound').hidden = false; }); return; }
    cat = S.getCategory(asset.categoryId);
    const isItem = cat && cat.type === 'item';

    // ---- 日時 (日本時間) ----
    // 明日の 10:00 (日本時間)
    function defaultStart() {
      const today = Math.floor((Date.now() + JST) / DAY) * DAY - JST;
      return new Date(today + DAY + 10 * HOUR).toISOString();
    }
    // URL の値は日本時間の 'YYYY-MM-DDTHH:MM' (旧形式の ISO も読める)
    function fromParam(v) { return v ? J.fromInput(v) : null; }
    const ms = v => core.toMs(v);

    function renderStatic() {
      document.querySelectorAll('[data-sk]').forEach(el => { el.textContent = tt(el.dataset.sk); });
      const loc = S.getLocation(asset.locationId);
      $('#crumb').innerHTML = '<a href="index.html" style="color:var(--color-primary)">' + esc(I.t('nav.categories')) + '</a> › <a href="search.html?category=' + encodeURIComponent(asset.categoryId) + '" style="color:var(--color-primary)">' + esc(catName(cat)) + '</a> › ' + esc(assetName(asset));
      $('#d-image').innerHTML = window.SkyRentPhotos ? window.SkyRentPhotos.thumbHtml(asset) : esc(asset.image || '📦');
      $('#d-cat').textContent = catName(cat) + ' ・ ' + (loc ? (isEn() && loc.nameEn ? loc.nameEn : loc.name) : '');
      $('#d-name').textContent = assetName(asset);
      $('#d-loc').textContent = loc ? ((loc.address || '') + (loc.tel ? ' / ' + loc.tel : '') + (loc.hours ? ' / ' + loc.hours : '')) : '';

      // 免許警告
      if (asset.requiredLicense) {
        $('#d-license').innerHTML = '<div class="license-box"><strong>⚠ ' + esc(I.t('detail.license')) + '</strong>' + esc(asset.requiredLicense) + '</div>';
      } else { $('#d-license').innerHTML = ''; }

      // スペック表 (共通 + カスタム項目)
      const rows = [];
      rows.push([tt('cat'), esc(catName(cat))]);
      rows.push([tt('loc'), esc(loc ? (isEn() && loc.nameEn ? loc.nameEn : loc.name) : '')]);
      if (asset.capacity) rows.push([tt('cap'), esc(asset.capacity) + (isEn() ? '' : '名')]);
      if (asset.plate) rows.push([tt('plate'), esc(asset.plate)]);
      if (isItem) rows.push([tt('stock'), esc(asset.stock) + (isEn() ? ' units' : '点')]);
      (cat.customFieldDefs || []).forEach(def => {
        const v = (asset.customFields || {})[def.key];
        if (v == null || v === '') return;
        rows.push([def.label, esc(v) + (def.unit ? ' ' + esc(def.unit) : '')]);
      });
      $('#d-specs').innerHTML = rows.map(r => '<tr><th>' + esc(r[0]) + '</th><td>' + r[1] + '</td></tr>').join('');

      // 料金プラン
      $('#price-title').textContent = tt('plans');
      const plans = [];
      if (asset.priceHour) plans.push([tt('ph'), yen(asset.priceHour)]);
      if (asset.priceDay) plans.push([tt('pd'), yen(asset.priceDay)]);
      if (asset.priceWeek) plans.push([tt('pw'), yen(asset.priceWeek)]);
      if (asset.priceMonth) plans.push([tt('pm'), yen(asset.priceMonth)]);
      $('#d-plans').innerHTML = plans.map(r => '<tr><th>' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td></tr>').join('');
      const R = Object.assign({}, core.DEFAULT_RULES, P.rules());
      $('#d-plan-note').textContent = isEn() ? '' :
        '税込。土日祝は' + yen(R.weekendHolidayFee || 0) + '、繁忙期は' + yen(R.busyFee || 0) + 'の割増 (1回)、' +
        R.nightStartHour + '時〜翌' + R.nightEndHour + '時の貸出・返却は夜間料金 ' + yen(R.nightFee || 0) + ' (各1回) がかかります。';
      $('#p-discount-note').textContent = tt('discountNote');
    }

    function renderOptions() {
      options = S.optionsForCategory(asset.categoryId);
      const area = $('#opt-area');
      const R = P.rules();
      const shortMax = Number(R.shortHoursMax) || 0;
      let html = '';
      function group(title, list) {
        if (!list.length) return '';
        return '<div class="opt-group-title">' + esc(title) + '</div>' + list.map(o => {
          const unit = o.priceType === 'per_rental' ? tt('perRental') : tt('perDay');
          const short = o.priceType !== 'per_rental' && o.priceShort != null && shortMax > 0
            ? '<small>' + shortMax + '時間以内は ' + esc(yen(o.priceShort)) + '</small>' : '';
          const desc = o.description ? '<small>' + esc(o.description) + '</small>' : '';
          const checked = selectedOptions.some(x => x.optionId === o.optionId) ? ' checked' : '';
          return '<label class="opt-row"><input type="checkbox" data-opt="' + esc(o.optionId) + '" data-group="' + esc(o.exclusiveGroup || '') + '"' + checked + '>' +
            '<span class="on">' + esc(o.name) + desc + short + '</span>' +
            '<span class="op">' + esc(yen(o.price)) + ' <small>' + unit + '</small></span></label>';
        }).join('');
      }
      html += group(I.t('detail.optCommon'), options.common);
      html += group(I.t('detail.optSpecific'), options.specific);
      area.innerHTML = html;
      area.querySelectorAll('[data-opt]').forEach(cb => cb.addEventListener('change', () => {
        // 同じグループ (補償など) は1つだけ選べる
        if (cb.checked && cb.dataset.group) {
          area.querySelectorAll('[data-opt]').forEach(o => { if (o !== cb && o.dataset.group === cb.dataset.group) o.checked = false; });
        }
        recalcOptions(); recalc();
      }));
    }
    function recalcOptions() {
      const ids = [...document.querySelectorAll('[data-opt]:checked')].map(c => c.dataset.opt);
      const all = options.common.concat(options.specific);
      selectedOptions = all.filter(o => ids.indexOf(o.optionId) >= 0);
    }

    function initInputs() {
      let start = fromParam(params.get('start')) || defaultStart();
      let end = fromParam(params.get('end'));
      if (!end || ms(end) <= ms(start)) end = new Date(ms(start) + DAY).toISOString();
      $('#p-start').value = J.toInput(start);
      $('#p-end').value = J.toInput(end);
      const today = Math.floor((Date.now() + JST) / DAY) * DAY - JST;
      $('#p-start').min = J.toInput(today);
      $('#p-end').min = J.toInput(today);
      if (isItem && asset.stock > 1) {
        $('#qty-wrap').style.display = 'flex';
      }
      $('#p-start').addEventListener('change', onStartChange);
      $('#p-end').addEventListener('change', recalc);
      // 以前の予約途中の選択 (同じ車両) を引き継ぐ
      let pending = null;
      try { pending = JSON.parse(sessionStorage.getItem(PENDING_KEY) || 'null'); } catch (e) { pending = null; }
      if (pending && !pending.done && pending.assetId === asset.assetId && Array.isArray(pending.optionIds)) {
        document.querySelectorAll('[data-opt]').forEach(cb => { cb.checked = pending.optionIds.indexOf(cb.dataset.opt) >= 0; });
      }
    }
    // 出発日時を動かしたら、返却日時も同じ利用時間だけずらす (返却が出発より前にならないように)
    let lastStart = null;
    function onStartChange() {
      const s = J.fromInput($('#p-start').value), e = J.fromInput($('#p-end').value);
      if (s && e && lastStart && ms(e) > ms(lastStart)) {
        const dur = ms(e) - ms(lastStart);
        if (ms(e) <= ms(s)) $('#p-end').value = J.toInput(ms(s) + dur);
      } else if (s && (!e || ms(e) <= ms(s))) {
        $('#p-end').value = J.toInput(ms(s) + DAY);
      }
      recalc();
    }

    function periodFromInputs() {
      const start = J.fromInput($('#p-start').value), end = J.fromInput($('#p-end').value);
      return { start: start, end: end, valid: !!(start && end && ms(end) > ms(start)) };
    }

    // ---- 空き状況の表示 ----
    function showReason(text) {
      const el = $('#p-reason');
      el.hidden = !text; el.textContent = text || '';
    }
    function showCheck(text) {
      const el = $('#p-check');
      el.hidden = !text; el.textContent = text || '';
    }
    function setAvail(ok, extra) {
      $('#p-avail').innerHTML = ok
        ? '<span class="badge ' + (extra ? 'stock' : 'ok') + '">' + esc(tt('avOk')) + (extra ? ' (' + esc(extra) + ')' : '') + '</span>'
        : '<span class="badge ng">' + esc(tt('avNg')) + '</span>';
    }

    // 営業時間 '9:00-19:00' → [540, 1140] (分)。読めなければ 9:00〜18:00
    function businessHours() {
      const loc = S.getLocation(asset.locationId);
      const m = /(\d{1,2}):(\d{2})\s*[-〜~ー–－]\s*(\d{1,2}):(\d{2})/.exec(String((loc && loc.hours) || ''));
      if (!m) return [9 * 60, 18 * 60];
      return [(+m[1]) * 60 + (+m[2]), (+m[3]) * 60 + (+m[4])];
    }
    function inHours(t, h) {
      const mins = Math.floor(((t + JST) % DAY + DAY) % DAY / MIN);
      return mins >= h[0] && mins < h[1];
    }
    // 本番: 画面の空き判定に使えるのは読み込んだ範囲 (日本時間の昨日 0:00 から 120 日) だけ
    function knownUntil() {
      if (!B.live) return Infinity;
      const today = Math.floor((Date.now() + JST) / DAY) * DAY - JST;
      return today - DAY + 120 * DAY;
    }
    // 希望日時に近い、予約できる日時 (同じ利用時間・営業時間内・30分刻み) を最大3つ
    function suggestions(start, end) {
      const s0 = ms(start), dur = ms(end) - s0;
      if (!(dur > 0)) return [];
      const h = businessHours(), until = knownUntil(), now = Date.now();
      const STEP = 30 * MIN;
      const base = Math.floor(s0 / STEP) * STEP;
      const found = [];
      for (let t = base - 12 * HOUR; t <= base + 14 * DAY; t += STEP) {
        const e = t + dur;
        if (t === s0 || t < now + HOUR || e > until) continue;
        if (!inHours(t, h) || !inHours(e, h)) continue;
        const av = S.availability(asset.assetId, new Date(t).toISOString(), new Date(e).toISOString(), 1);
        if (av.ok) found.push({ t: t, e: e, d: Math.abs(t - s0) });
      }
      return found.sort((a, b) => a.d - b.d).slice(0, 3).sort((a, b) => a.t - b.t);
    }
    function renderSuggestions(start, end) {
      const box = $('#p-suggest');
      const list = start && end ? suggestions(start, end) : [];
      if (!list.length) { box.hidden = true; box.innerHTML = ''; return; }
      box.hidden = false;
      box.innerHTML = '<p>' + esc(tt('suggest')) + '</p>' + list.map(c =>
        '<button type="button" data-s="' + c.t + '" data-e="' + c.e + '">' + esc(J.format(c.t)) + ' 〜 ' + esc(J.format(c.e)) + '</button>').join('');
      box.querySelectorAll('button[data-s]').forEach(b => b.addEventListener('click', () => {
        $('#p-start').value = J.toInput(Number(b.dataset.s));
        $('#p-end').value = J.toInput(Number(b.dataset.e));
        recalc();
      }));
    }

    // ---- 本番: サーバーでも空きを確かめる (担当者の予定は Google に直接問い合わせる。入力が止まってから) ----
    let checkSeq = 0, checkTimer = null;
    function serverCheck(start, end, optionIds) {
      clearTimeout(checkTimer);
      const my = ++checkSeq;
      if (!B.live) return;
      showCheck(tt('checking'));
      checkTimer = setTimeout(async () => {
        let res = null;
        try {
          res = await B.quote({ assetId: asset.assetId, start: start, end: end, optionIds: optionIds });
        } catch (e) {
          if (my === checkSeq) showCheck(tt('checkFailed'));
          return;
        }
        if (my !== checkSeq) return;   // 入力が変わった後の古い結果は捨てる
        const reasons = (res && res.availability && res.availability.reasons) || [];
        if (reasons.length) {
          setAvail(false);
          showReason(B.errorMessage(reasons[0]));
          $('#book-btn').disabled = true;
          renderSuggestions(start, end);
          showCheck('');
        } else {
          showCheck(tt('checked'));
        }
      }, 400);
    }

    function recalc() {
      const per = periodFromInputs();
      lastStart = per.start;
      clearTimeout(checkTimer); checkSeq++;
      showReason(''); showCheck(''); renderSuggestions(null, null);
      if (!per.valid) {
        $('#p-lines').innerHTML = '<div class="pl"><span class="muted">' + esc(tt('invalid')) + '</span></div>';
        $('#p-total').textContent = yen(0);
        $('#p-avail').innerHTML = '';
        $('#book-btn').disabled = true;
        return;
      }
      const start = per.start, end = per.end;
      // 空き & 在庫 (車両の予約・受け渡し担当者の予定・受け渡し時刻の重複)
      const av = S.availability(asset.assetId, start, end, 1);
      const maxQty = Math.max(1, av.remaining);
      if (isItem && asset.stock > 1) {
        const sel = $('#p-qty');
        const cur = parseInt(sel.value || '1', 10);
        let opts = '';
        for (let i = 1; i <= maxQty; i++) opts += '<option value="' + i + '"' + (i === cur ? ' selected' : '') + '>' + i + '</option>';
        sel.innerHTML = opts;
        if (!sel.onchange) sel.onchange = recalc;
      }
      const qty = isItem && asset.stock > 1 ? parseInt($('#p-qty').value || '1', 10) : 1;

      // 見積 (pricing-core: 補償の短時間料金・土日祝/繁忙期/夜間の割増の行がそのまま出る)
      const calc = P.calculate({ asset: asset, start: start, end: end, quantity: qty, options: selectedOptions });
      $('#p-lines').innerHTML = calc.lines.map(l => '<div class="pl' + (l.amount < 0 ? ' minus' : '') + '"><span>' + esc(l.label) + '</span><span>' + esc(yen(l.amount)) + '</span></div>').join('');
      $('#p-total').textContent = yen(calc.total);

      if (ms(start) <= Date.now()) {
        setAvail(false); showReason(tt('past'));
        $('#book-btn').disabled = true;
        return;
      }
      if (!calc.ok) {
        setAvail(false); showReason(B.errorMessage(calc.errors[0]));
        $('#book-btn').disabled = true;
        return;
      }
      const ok = av.ok && av.remaining >= qty;
      if (!ok) {
        setAvail(false);
        showReason(av.code ? B.errorMessage(av.code) : (av.reason ? av.reason + (isEn() ? '' : '。日時または車両を変更してください。') : ''));
        renderSuggestions(start, end);
      } else {
        setAvail(true, isItem && asset.stock > 1 ? tt('stockLeft')(av.remaining) : '');
        serverCheck(start, end, selectedOptions.map(o => o.optionId));
      }
      $('#book-btn').disabled = !ok;
    }

    $('#book-btn').addEventListener('click', () => {
      const per = periodFromInputs();
      if (!per.valid) { recalc(); return; }
      const qty = isItem && asset.stock > 1 ? parseInt($('#p-qty').value || '1', 10) : 1;
      recalcOptions();
      // 予約途中の冪等キーは引き継ぐ (前回の送信の結果が分からないまま選び直したときの二重予約を防ぐ)
      let prev = null;
      try { prev = JSON.parse(sessionStorage.getItem(PENDING_KEY) || 'null'); } catch (e) { prev = null; }
      const next = {
        assetId: asset.assetId, start: per.start, end: per.end, quantity: qty,
        optionIds: selectedOptions.map(o => o.optionId)
      };
      if (prev && !prev.done && prev.idempotencyKey) next.idempotencyKey = prev.idempotencyKey;
      if (prev && !prev.done && prev.assetId === asset.assetId && prev.discountType) next.discountType = prev.discountType;
      try { sessionStorage.setItem(PENDING_KEY, JSON.stringify(next)); } catch (e) { /* 続行 */ }
      location.href = 'booking.html';
    });

    let booted = false;
    function boot() {
      if (booted) return;
      booted = true;
      $('#detail-grid').hidden = false;
      renderStatic(); renderOptions(); initInputs(); recalcOptions(); recalc();
    }
    document.addEventListener('DOMContentLoaded', boot);
    document.addEventListener('sky-rent:langchange', () => { renderStatic(); recalcOptions(); renderOptions(); recalcOptions(); recalc(); });
    if (document.readyState !== 'loading') boot();
  })();
  </script>
</body>
</html>
