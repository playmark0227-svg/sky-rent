<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空き状況を検索 | グロースレンタカー</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/public.css">
</head>
<body>
  <header class="site-header solid">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-mark">G</span><span class="logo-text">グロースレンタカー</span></a>
      <nav class="site-nav">
        <a href="index.html#categories" data-i18n="nav.categories" class="nav-hide-sp">カテゴリ</a>
        <a href="index.html#locations" data-i18n="nav.locations" class="nav-hide-sp">店舗一覧</a>
        <a href="mypage.html" data-i18n="nav.mypage">マイページ</a>
        <a href="search.html" class="nav-cta" data-i18n="nav.search">予約する</a>
        <button class="lang-btn" data-lang-toggle type="button">EN</button>
      </nav>
    </div>
  </header>

  <main class="container page-offset" style="padding-bottom:60px">
    <div class="steps">
      <span class="step active"><span class="n">1</span><span data-sk="s1">検索</span></span>
      <span class="sep">›</span>
      <span class="step"><span class="n">2</span><span data-sk="s2">車両を選択</span></span>
      <span class="sep">›</span>
      <span class="step"><span class="n">3</span><span data-sk="s3">情報入力</span></span>
      <span class="sep">›</span>
      <span class="step"><span class="n">4</span><span data-sk="s4">完了</span></span>
    </div>

    <form class="p-searchbar mb16" id="searchbar">
      <div class="fg"><label data-i18n="search.category">カテゴリ</label><select id="s-category"></select></div>
      <div class="fg"><label data-i18n="search.location">利用拠点</label><select id="s-location"></select></div>
      <div class="fg"><label data-i18n="search.start">出発日時 (受取)</label><input type="datetime-local" id="s-start"></div>
      <div class="fg"><label data-i18n="search.end">返却日時</label><input type="datetime-local" id="s-end"></div>
      <button type="submit" class="btn btn-primary" data-i18n="search.submit">検索する</button>
    </form>
    <p class="muted" id="tz-note" style="font-size:12px;margin:-8px 0 14px">日時は日本時間です。</p>

    <div class="filter-panel" id="filter-panel" hidden></div>

    <div class="flex-sb mb16">
      <p class="muted" id="result-count" style="font-size:14px"></p>
      <div class="fg" style="display:flex;align-items:center;gap:6px">
        <label class="muted" style="font-size:12px;font-weight:600" id="sort-label">並び替え</label>
        <select id="sort" style="padding:7px 10px;border:1px solid var(--color-border);border-radius:5px;font-size:13px">
          <option value="rec" data-sk="sort-rec">おすすめ順</option>
          <option value="asc" data-sk="sort-asc">料金が安い順</option>
          <option value="desc" data-sk="sort-desc">料金が高い順</option>
        </select>
      </div>
    </div>

    <p id="search-error" class="error-text" hidden role="alert"></p>
    <div class="asset-grid" id="results"></div>
  </main>

  <footer class="site-footer"><div class="container"><div class="footer-bottom" style="border-top:none"><span data-i18n="footer.copyright">© 2026 グロースレンタカー</span><a href="index.html">← トップへ戻る</a></div></div></footer>

  <script src="js/config.js?v=20260923"></script>
  <script src="js/store.js?v=20260923"></script>
  <script src="js/pricing-core.js?v=20260923"></script>
  <script src="js/pricing.js?v=20260923"></script>
  <script src="js/i18n.js?v=20260923"></script>
  <script src="js/api.js?v=20260923"></script>
  <script src="js/photos.js?v=20260923"></script>
  <script src="js/backend.js?v=20260923"></script>
  <script src="js/boot.js?v=20260923"></script>
  <script type="text/x-deferred">
  (function () {
    'use strict';
    const S = window.SkyRentStore, I = window.SkyRentI18n, P = window.SkyRentPricing, B = window.SkyRentBackend;
    const core = window.SkyRentPricingCore;
    const J = B.jst;
    const $ = s => document.querySelector(s);
    function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    const isEn = () => I.getLang() === 'en';
    const catName = c => c && isEn() && c.nameEn ? c.nameEn : (c ? c.name : '');
    const assetName = a => isEn() && a.nameEn ? a.nameEn : a.name;
    const HOUR = 3600000, DAY = 86400000, JST = 9 * HOUR;

    const L = {
      s1: { ja: '検索', en: 'Search' }, s2: { ja: '車両を選択', en: 'Select' }, s3: { ja: '情報入力', en: 'Details' }, s4: { ja: '完了', en: 'Done' },
      'sort-rec': { ja: 'おすすめ順', en: 'Recommended' }, 'sort-asc': { ja: '料金が安い順', en: 'Price ↑' }, 'sort-desc': { ja: '料金が高い順', en: 'Price ↓' },
      results: { ja: (n, all) => n + ' 件の空きが見つかりました (全' + all + '件)', en: (n, all) => n + ' of ' + all + ' available' },
      listed: { ja: n => n + ' 件の車両があります。日時を指定すると空き状況を表示します。', en: n => n + ' vehicle(s). Set dates to check availability.' },
      perday: { ja: '/24時間', en: '/24h' }, perhour: { ja: '〜/時', en: '〜/hr' },
      lic: { ja: '要免許', en: 'License req.' }, filterLabel: { ja: '絞り込み', en: 'Filter' }, any: { ja: '指定なし', en: 'Any' },
      over: { ja: '以上', en: '+' },
      badPeriod: { ja: '返却日時は出発日時より後にしてください。', en: 'Return time must be after pick-up time.' },
      past: { ja: '過去の日時はご予約いただけません。出発日時をご確認ください。', en: 'The pick-up time is in the past.' },
      tz: { ja: '日時は日本時間です。', en: 'All times are Japan Standard Time (JST).' },
      details: { ja: '詳細・予約', en: 'Details & Book' }, view: { ja: '詳細を見る', en: 'View details' }
    };
    const tt = k => L[k][isEn() ? 'en' : 'ja'];
    const ms = v => core.toMs(v);

    // 明日の 10:00 (日本時間)
    function defaultStart() {
      const today = Math.floor((Date.now() + JST) / DAY) * DAY - JST;
      return new Date(today + DAY + 10 * HOUR).toISOString();
    }
    // URL の日時は日本時間の 'YYYY-MM-DDTHH:MM' (旧形式の ISO も読める)
    function fromParam(v) { return v ? J.fromInput(v) : null; }

    const params = new URLSearchParams(location.search);
    let state = {
      category: params.get('category') || '',
      location: params.get('location') || '',
      start: fromParam(params.get('start')) || '',
      end: fromParam(params.get('end')) || '',
      filters: {},
      sort: 'rec'
    };
    // カスタムフィルタ (f_key)
    params.forEach((v, k) => { if (k.indexOf('f_') === 0) state.filters[k.slice(2)] = v; });

    function initBar() {
      const cats = S.categories(), locs = S.locations();
      $('#s-category').innerHTML = '<option value="">' + esc(I.t('search.all')) + '</option>' + cats.map(c => '<option value="' + esc(c.categoryId) + '"' + (c.categoryId === state.category ? ' selected' : '') + '>' + esc(catName(c)) + '</option>').join('');
      $('#s-location').innerHTML = '<option value="">' + esc(I.t('search.all')) + '</option>' + locs.map(l => '<option value="' + esc(l.locationId) + '"' + (l.locationId === state.location ? ' selected' : '') + '>' + esc(isEn() && l.nameEn ? l.nameEn : l.name) + '</option>').join('');
      if (!state.start) state.start = defaultStart();
      if (!state.end) state.end = new Date(ms(state.start) + DAY).toISOString();
      $('#s-start').value = J.toInput(state.start);
      $('#s-end').value = J.toInput(state.end);
      const today = Math.floor((Date.now() + JST) / DAY) * DAY - JST;
      $('#s-start').min = J.toInput(today);
      $('#s-end').min = J.toInput(today);
      $('#tz-note').textContent = tt('tz');
      // ステップ・並び替えラベル
      document.querySelectorAll('[data-sk]').forEach(el => { el.textContent = tt(el.dataset.sk); });
      $('#sort-label').textContent = isEn() ? 'Sort' : '並び替え';
    }

    function renderFilters() {
      const panel = $('#filter-panel');
      const cat = state.category ? S.getCategory(state.category) : null;
      if (!cat || !cat.customFieldDefs) { panel.hidden = true; panel.innerHTML = ''; return; }
      const defs = cat.customFieldDefs.filter(d => d.filterable);
      if (!defs.length) { panel.hidden = true; panel.innerHTML = ''; return; }
      panel.hidden = false;
      panel.innerHTML = '<span class="muted" style="font-weight:700">' + (isEn() ? 'Filter' : 'こだわり条件') + ':</span>' + defs.map(d => {
        const cur = state.filters[d.key] || '';
        if (d.type === 'select') {
          return '<div class="fg"><label>' + esc(d.label) + '</label><select data-fk="' + esc(d.key) + '"><option value="">' + tt('any') + '</option>' +
            (d.options || []).map(o => '<option value="' + esc(o) + '"' + (cur === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></div>';
        }
        return '<div class="fg"><label>' + esc(d.label) + (d.unit ? ' (' + esc(d.unit) + ')' : '') + tt('over') + '</label><input type="number" data-fk="' + esc(d.key) + '" value="' + esc(cur) + '" style="width:90px"></div>';
      }).join('');
      panel.querySelectorAll('[data-fk]').forEach(el => {
        el.addEventListener('change', () => {
          const k = el.dataset.fk;
          if (el.value) state.filters[k] = el.value; else delete state.filters[k];
          run();
        });
      });
    }

    function priceLabel(a) {
      const day = a.priceDay ? P.yen(a.priceDay) + tt('perday') : '';
      if (a.priceHour) return P.yen(a.priceHour) + tt('perhour') + ' / ' + day;
      return day;
    }

    function run() {
      // URL 同期 (日時は日本時間の 'YYYY-MM-DDTHH:MM')
      const p = new URLSearchParams();
      if (state.category) p.set('category', state.category);
      if (state.location) p.set('location', state.location);
      if (state.start) p.set('start', J.toInput(state.start));
      if (state.end) p.set('end', J.toInput(state.end));
      Object.keys(state.filters).forEach(k => p.set('f_' + k, state.filters[k]));
      try { history.replaceState(null, '', 'search.html?' + p.toString()); } catch (e) { /* 続行 */ }

      const err = $('#search-error');
      err.hidden = true;
      let problem = '';
      if (!state.start || !state.end || ms(state.end) <= ms(state.start)) problem = tt('badPeriod');
      else if (ms(state.start) <= Date.now()) problem = tt('past');
      if (problem) { err.hidden = false; err.textContent = problem; }
      const checkDates = !problem;

      renderFilters();
      let items = S.searchAvailable({
        categoryId: state.category, locationId: state.location,
        start: checkDates ? state.start : '', end: checkDates ? state.end : '', quantity: 1, filters: state.filters
      });
      if (state.sort === 'asc') items.sort((a, b) => (a.priceDay || 0) - (b.priceDay || 0));
      else if (state.sort === 'desc') items.sort((a, b) => (b.priceDay || 0) - (a.priceDay || 0));
      else if (checkDates) items.sort((a, b) => (b.availability.ok ? 1 : 0) - (a.availability.ok ? 1 : 0));  // おすすめ順: 予約できる車両を先に

      const okCount = items.filter(a => a.availability.ok).length;
      $('#result-count').textContent = checkDates ? tt('results')(okCount, items.length) : tt('listed')(items.length);
      // 本番: この画面が読み込んだ空き状況は 120 日先まで。それより先は詳細画面でサーバーに確かめる
      const known = Math.floor((Date.now() + JST) / DAY) * DAY - JST - DAY + 120 * DAY;
      if (B.live && checkDates && ms(state.end) > known) {
        $('#result-count').textContent += isEn() ? ' (Availability for dates beyond 120 days is checked on the details page.)' : ' (120日より先の空き状況は、詳細画面で確認します)';
      }
      const grid = $('#results');
      if (!items.length) { grid.innerHTML = '<p class="muted tc" style="grid-column:1/-1;padding:40px">' + esc(I.t('search.noresults')) + '</p>'; return; }

      grid.innerHTML = items.map(a => {
        const cat = S.getCategory(a.categoryId);
        const loc = S.getLocation(a.locationId);
        const av = a.availability;
        const isItem = cat && cat.type === 'item';
        let badge = '', reason = '';
        if (!checkDates) badge = '';
        else if (!av.ok) {
          badge = '<span class="badge ng">' + esc(I.t('search.unavailable')) + '</span>';
          // 予約できない理由 (他の予約・受け渡し担当者の予定・受け渡し時刻の重複)
          const text = av.code ? B.errorMessage(av.code) : av.reason;
          if (text) reason = '<div class="meta" style="color:#ffb4a8;line-height:1.7">' + esc(text) + '</div>';
        }
        else if (isItem && av.stock > 1) badge = '<span class="badge stock">' + esc(I.t('search.stock')) + ' ' + esc(av.remaining) + '</span>';
        else badge = '<span class="badge ok">' + esc(I.t('search.available')) + '</span>';
        const lic = a.requiredLicense ? ' <span class="badge lic">' + tt('lic') + '</span>' : '';
        const q = 'id=' + encodeURIComponent(a.assetId) + (state.start ? '&start=' + encodeURIComponent(J.toInput(state.start)) : '') + (state.end ? '&end=' + encodeURIComponent(J.toInput(state.end)) : '');
        const btn = !checkDates
          ? '<a class="btn btn-secondary" href="detail.html?' + q + '">' + tt('view') + '</a>'
          : av.ok
            ? '<a class="btn btn-primary" href="detail.html?' + q + '">' + tt('details') + '</a>'
            : '<a class="btn btn-secondary" href="detail.html?' + q + '">' + (isEn() ? 'Other dates' : '別の日時を探す') + '</a>';
        return '<div class="asset-card ' + (!checkDates || av.ok ? 'ok' : 'ng') + '">' +
          '<div class="thumb">' + (window.SkyRentPhotos ? window.SkyRentPhotos.thumbHtml(a) : esc(a.image || '📦')) + '</div>' +
          '<div class="body">' +
          '<div class="cat">' + esc(catName(cat)) + ' ・ ' + esc(loc ? (isEn() && loc.nameEn ? loc.nameEn : loc.name) : '') + '</div>' +
          '<div class="name">' + esc(assetName(a)) + lic + '</div>' +
          (badge ? '<div style="margin:2px 0">' + badge + '</div>' : '') + reason +
          '<div class="price">' + esc(priceLabel(a)) + '</div>' +
          '</div>' + btn + '</div>';
      }).join('');
    }

    $('#searchbar').addEventListener('submit', e => {
      e.preventDefault();
      state.category = $('#s-category').value;
      state.location = $('#s-location').value;
      state.start = J.fromInput($('#s-start').value) || '';
      state.end = J.fromInput($('#s-end').value) || '';
      state.filters = {}; // カテゴリ変更でフィルタリセット
      run();
    });
    $('#sort').addEventListener('change', () => { state.sort = $('#sort').value; run(); });

    let booted = false;
    function boot() { if (booted) return; booted = true; initBar(); run(); }
    document.addEventListener('DOMContentLoaded', boot);
    document.addEventListener('sky-rent:langchange', () => { initBar(); run(); });
    if (document.readyState !== 'loading') boot();
  })();
  </script>
</body>
</html>
