<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お知らせ管理 | Sky Rent 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">お知らせ管理</h1>
    <p class="page-note">予約サイトのトップに表示するお知らせ・ニュース。</p>

    <div style="text-align:right;margin-bottom:10px">
      <button id="btn-add" class="btn btn-primary">+ お知らせを追加</button>
    </div>

    <section class="card">
      <table class="data-table list">
        <thead><tr><th>掲載日</th><th>タイトル</th><th>カテゴリ</th><th>公開期限</th><th>状態</th><th></th></tr></thead>
        <tbody id="tbl"></tbody>
      </table>
    </section>
  </main>

  <script src="partials.js"></script>
  <script src="js/crud.js"></script>
  <script>
  SkyRentCRUD.init({
    storageKey: 'notices',
    idPrefix: 'N',
    columns: [
      { key: 'date',     label: '掲載日',  type: 'date', required: true },
      { key: 'title',    label: 'タイトル', bold: true, required: true },
      { key: 'category', label: 'カテゴリ', type: 'select', options: ['お知らせ','キャンペーン','システム','メンテナンス'] },
      { key: 'expiry',   label: '公開期限' },
      { key: 'active',   label: '状態', type: 'status' }
    ],
    defaults: [
      { date: '2026-04-29', title: '管理画面をリニューアルしました', category: 'システム',   expiry: '2026/05/29', active: true },
      { date: '2026-04-15', title: '春のキャンペーン開始のお知らせ', category: 'キャンペーン', expiry: '2026/06/30', active: true },
      { date: '2026-04-10', title: 'GW期間の営業時間変更',           category: 'お知らせ',     expiry: '2026/05/06', active: true },
      { date: '2026-03-20', title: '新車種追加のお知らせ',           category: 'お知らせ',     expiry: '無期限',     active: true },
      { date: '2026-05-15', title: '夏休みキャンペーン (準備中)',    category: 'キャンペーン', expiry: '-',          active: false }
    ]
  });
  </script>
</body>
</html>
