<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダッシュボード | Sky Rent 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <!-- 日付・拠点バー -->
    <section class="date-bar card">
      <div class="date-bar-left">
        <div class="date-input">
          <input type="number" id="date-y" min="2020" max="2099"> 年
          <input type="number" id="date-m" min="1" max="12"> 月
          <input type="number" id="date-d" min="1" max="31"> 日
        </div>
        <div class="date-nav">
          <a href="#" id="date-prev">◀前の日</a>
          <a href="#" id="date-today">本日を表示</a>
          <a href="#" id="date-next">次の日▶</a>
        </div>
        <div class="filter-group"><label style="font-weight:600">拠点</label>
          <select id="loc-filter" style="padding:6px 10px;border:1px solid var(--border);border-radius:3px"></select>
        </div>
      </div>
      <div class="date-bar-right"><button id="btn-search" class="btn btn-primary">検 索</button></div>
    </section>

    <div class="print-bar"><span class="badge-new">new</span><button class="btn btn-gray" id="btn-print">貸渡・返却リスト印刷</button></div>

    <!-- KPI 4枚 -->
    <section class="kpi-row" style="grid-template-columns:repeat(4,1fr)">
      <a class="kpi kpi-1" href="reservation-list.html"><div class="kpi-label">本日の予約受付</div><div class="kpi-value"><span id="kpi-bookings">0</span><span class="kpi-unit">件</span></div></a>
      <a class="kpi kpi-2" href="reservation-list.html"><div class="kpi-label">本日の出発</div><div class="kpi-value"><span id="kpi-depart">0</span><span class="kpi-unit">件</span></div></a>
      <a class="kpi kpi-3" href="reservation-list.html"><div class="kpi-label">本日の帰着</div><div class="kpi-value"><span id="kpi-return">0</span><span class="kpi-unit">件</span></div></a>
      <a class="kpi kpi-1" href="revenue.html" style="background:#2e7d5b"><div class="kpi-label">今月の売上</div><div class="kpi-value" style="font-size:38px">¥<span id="kpi-sales">0</span></div></a>
    </section>

    <!-- 拠点別サマリー -->
    <section class="card" style="padding:14px 16px;margin-bottom:12px">
      <strong class="card-section-title">拠点別サマリー (本日)</strong>
      <div id="loc-summary" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"></div>
    </section>

    <!-- 未処理アラート -->
    <section class="card" id="alert-card" style="padding:14px 16px;margin-bottom:12px;border-left:4px solid #e54848"></section>

    <!-- 中段 -->
    <section class="mid-row">
      <div class="mid-card">
        <div class="chart-wrap"><canvas id="chart-week"></canvas></div>
        <table class="data-table"><thead><tr><th>受付日</th><th>対象</th><th>拠点</th><th>借受人</th></tr></thead><tbody id="tbl-bookings"><tr class="empty"><td colspan="4">-</td></tr></tbody></table>
      </div>
      <div class="mid-card">
        <div style="padding:10px 14px;font-weight:700;color:var(--primary);border-bottom:1px solid #eee">本日の出発予定</div>
        <table class="data-table"><thead><tr><th>時刻</th><th>対象</th><th>拠点</th><th>借受人</th><th></th></tr></thead><tbody id="tbl-departures"><tr class="empty"><td colspan="5">-</td></tr></tbody></table>
        <div class="card-footer-link"><a href="reservation-list.html">予約一覧へ</a></div>
      </div>
      <div class="mid-card">
        <div style="padding:10px 14px;font-weight:700;color:var(--primary);border-bottom:1px solid #eee">本日の帰着予定</div>
        <table class="data-table"><thead><tr><th>時刻</th><th>対象</th><th>拠点</th><th>借受人</th><th></th></tr></thead><tbody id="tbl-returns"><tr class="empty"><td colspan="5">-</td></tr></tbody></table>
      </div>
    </section>

    <!-- 下段 -->
    <section class="bottom-row">
      <div class="bottom-card">
        <h3 class="bottom-title">自動通知ログ (メール送信)</h3>
        <ul class="news-list" id="notif-list"><li>-</li></ul>
      </div>
      <div class="bottom-card">
        <h3 class="bottom-title">社内お知らせ</h3>
        <ul class="news-list"><li>貸渡・返却の処理漏れがないようにしてください。</li><li>合計金額と免許確認を再確認してください。</li><li>物品は返却時に数量・破損をチェックしてください。</li></ul>
      </div>
      <div class="bottom-card">
        <h3 class="bottom-title">車検の期限が近い車両</h3>
        <table class="data-table compact"><thead><tr><th>車検満了日</th><th>車両</th><th>残</th></tr></thead><tbody id="tbl-shaken"><tr class="empty"><td colspan="3">-</td></tr></tbody></table>
        <div class="card-footer-link"><a href="shaken-list.html">車検一覧へ</a></div>
      </div>
    </section>
  </main>

  <div id="loading" class="loading" hidden><div class="spinner"></div></div>

  <script src="partials.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/pricing.js"></script>
  <script src="../js/api.js"></script>
  <script src="js/manage.js"></script>
</body>
</html>
