<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約キャンセル一覧 | グロースレンタカー 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">予約キャンセル一覧</h1>
    <p class="page-note">キャンセルされた予約の一覧。返金処理の参考にお使いください。</p>

    <section class="card filter-bar">
      <div class="filter-group">
        <label>期間</label>
        <input type="date" id="from"> 〜 <input type="date" id="to">
      </div>
      <div class="filter-group">
        <label>キーワード</label>
        <input type="text" id="kw" placeholder="顧客名・予約ID">
      </div>
      <button class="btn btn-primary" id="btn-filter">検 索</button>
    </section>

    <section class="card">
      <table class="data-table list">
        <thead>
          <tr>
            <th>予約ID</th>
            <th>キャンセル日時</th>
            <th>貸出予定日</th>
            <th>車種</th>
            <th>借受人</th>
            <th>連絡先</th>
            <th>備考</th>
          </tr>
        </thead>
        <tbody id="tbl"><tr class="empty"><td colspan="7">読み込み中...</td></tr></tbody>
      </table>
    </section>
  </main>

  <div id="loading" class="loading" hidden><div class="spinner"></div></div>

  <script src="partials.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/pricing.js"></script>
  <script src="../js/api.js"></script>
  <script>
  (function () {
    const $ = (s) => document.querySelector(s);
    let all = [];
    document.addEventListener('DOMContentLoaded', async () => {
      $('#btn-filter').addEventListener('click', filter);
      $('#kw').addEventListener('keypress', e => { if (e.key === 'Enter') filter(); });
      $('#loading').hidden = false;
      try {
        const list = await window.SkyRentAPI.listReservations();
        all = list.filter(r => r.status === 'cancelled');
        filter();
      } catch (err) {
        $('#tbl').innerHTML = `<tr class="empty"><td colspan="7">読み込み失敗: ${err.message}</td></tr>`;
      } finally { $('#loading').hidden = true; }
    });
    function filter() {
      const from = $('#from').value;
      const to = $('#to').value;
      const kw = $('#kw').value.trim().toLowerCase();
      let rows = all.slice();
      if (from) rows = rows.filter(r => new Date(r.start) >= new Date(from));
      if (to) rows = rows.filter(r => new Date(r.start) <= new Date(to + 'T23:59:59'));
      if (kw) rows = rows.filter(r =>
        (r.customerName||'').toLowerCase().includes(kw) ||
        (r.reservationId||'').toLowerCase().includes(kw));
      if (!rows.length) {
        $('#tbl').innerHTML = '<tr class="empty"><td colspan="7">キャンセルされた予約はありません</td></tr>';
        return;
      }
      $('#tbl').innerHTML = rows.map(r => `
        <tr>
          <td><code>${esc(r.reservationId)}</code></td>
          <td>${fmtD(r.createdAt || r.start)}</td>
          <td>${fmtD(r.start)}</td>
          <td>${esc(r.vehicleName)}</td>
          <td>${esc(r.customerName)}</td>
          <td><small>${esc(r.customerEmail||'')}<br>${esc(r.customerPhone||'')}</small></td>
          <td>${esc(r.note||'-')}</td>
        </tr>`).join('');
    }
    function fmtD(s) { if (!s) return '-'; const d = new Date(s); return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; }
    function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  })();
  </script>
</body>
</html>
