<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約サイト設定 | Sky Rent 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">予約サイト設定</h1>
    <p class="page-note">予約サイト全体に関わる基本設定。</p>

    <section class="card" style="padding:24px">
      <h3 style="margin-bottom:14px;font-size:15px;color:var(--primary)">基本情報</h3>
      <div class="form-row">
        <label>サイト名</label>
        <input type="text" class="form-input" value="Sky Rent">
      </div>
      <div class="form-row">
        <label>サイトURL</label>
        <input type="text" class="form-input" value="https://playmark0227-svg.github.io/sky-rent/">
      </div>
      <div class="form-row">
        <label>事業者コード</label>
        <input type="text" class="form-input" value="c00000-000001" readonly style="background:#f5f5f5">
      </div>
      <div class="form-row">
        <label>テーマカラー</label>
        <input type="color" value="#1c4a7a" style="width:60px;height:36px;border:1px solid var(--border);cursor:pointer">
      </div>
      <div class="form-row">
        <label>ロゴ画像</label>
        <div style="flex:1">
          <input type="file" accept="image/*">
          <small style="color:var(--muted);display:block;margin-top:4px">推奨: 200×60px / PNG透過</small>
        </div>
      </div>
    </section>

    <section class="card" style="margin-top:14px;padding:24px">
      <h3 style="margin-bottom:14px;font-size:15px;color:var(--primary)">予約設定</h3>
      <div class="form-row">
        <label>最短予約時間</label>
        <select class="form-input"><option>1時間前</option><option>3時間前</option><option selected>6時間前</option><option>1日前</option></select>
      </div>
      <div class="form-row">
        <label>最長予約期間</label>
        <select class="form-input"><option>30日先</option><option>60日先</option><option selected>180日先</option><option>365日先</option></select>
      </div>
      <div class="form-row">
        <label>キャンセル料</label>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px">
          <label class="chk"><input type="checkbox" checked> 7日前まで: 無料</label>
          <label class="chk"><input type="checkbox" checked> 3日前まで: 30%</label>
          <label class="chk"><input type="checkbox" checked> 前日: 50%</label>
          <label class="chk"><input type="checkbox" checked> 当日・無連絡: 100%</label>
        </div>
      </div>
      <div class="form-row">
        <label>支払方法</label>
        <div style="flex:1;display:flex;gap:14px;font-size:13px">
          <label class="chk"><input type="checkbox" checked> 店頭現金</label>
          <label class="chk"><input type="checkbox" checked> クレジットカード</label>
          <label class="chk"><input type="checkbox"> QRコード決済</label>
          <label class="chk"><input type="checkbox"> 銀行振込</label>
        </div>
      </div>
    </section>

    <section class="card" style="margin-top:14px;padding:24px">
      <h3 style="margin-bottom:14px;font-size:15px;color:var(--primary)">通知設定</h3>
      <div class="form-row">
        <label>予約確認メール</label>
        <label class="chk"><input type="checkbox" checked> 顧客に自動送信</label>
      </div>
      <div class="form-row">
        <label>店舗への通知</label>
        <input type="email" class="form-input" placeholder="info@sky-rent.example.com">
      </div>
      <div class="form-row">
        <label>送信元アドレス</label>
        <input type="email" class="form-input" value="noreply@sky-rent.example.com">
      </div>
    </section>

    <div style="text-align:center;margin-top:18px">
      <button class="btn btn-primary" onclick="alert('（デモ） 保存しました')" style="padding:12px 50px;font-size:15px">設定を保存</button>
    </div>
  </main>
  <style>.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}</style>
  <script src="_partials.js"></script>
</body>
</html>
