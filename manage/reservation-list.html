<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約一覧 | Sky Rent 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">予約一覧</h1>

    <section class="card filter-bar">
      <div class="filter-group">
        <label>期間</label>
        <input type="date" id="from"> 〜 <input type="date" id="to">
      </div>
      <div class="filter-group">
        <label>状態</label>
        <select id="status-filter">
          <option value="">すべて</option>
          <option value="confirmed">確定</option>
          <option value="cancelled">キャンセル</option>
        </select>
      </div>
      <div class="filter-group">
        <label>キーワード</label>
        <input type="text" id="keyword" placeholder="顧客名・車輌・予約ID">
      </div>
      <button class="btn btn-primary" id="btn-filter">検 索</button>
    </section>

    <section class="card">
      <table class="data-table list">
        <thead>
          <tr>
            <th>予約ID</th>
            <th>状態</th>
            <th>貸出</th>
            <th>返却</th>
            <th>車種</th>
            <th>車輌</th>
            <th>借受人</th>
            <th>連絡先</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbl">
          <tr class="empty"><td colspan="9">読み込み中...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <div id="loading" class="loading" hidden><div class="spinner"></div></div>

  <script src="partials.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
  (function () {
    const $ = (s) => document.querySelector(s);
    let allRows = [];

    document.addEventListener('DOMContentLoaded', async () => {
      $('#btn-filter').addEventListener('click', applyFilter);
      $('#keyword').addEventListener('keypress', e => { if (e.key === 'Enter') applyFilter(); });
      await load();
    });

    async function load() {
      $('#loading').hidden = false;
      try {
        allRows = await window.SkyRentAPI.listReservations();
        applyFilter();
      } catch (err) {
        $('#tbl').innerHTML = `<tr class="empty"><td colspan="9">読み込み失敗: ${err.message}</td></tr>`;
      } finally {
        $('#loading').hidden = true;
      }
    }

    function applyFilter() {
      const from = $('#from').value;
      const to = $('#to').value;
      const status = $('#status-filter').value;
      const kw = $('#keyword').value.trim().toLowerCase();
      let rows = allRows.slice();
      if (from) rows = rows.filter(r => new Date(r.start) >= new Date(from));
      if (to) rows = rows.filter(r => new Date(r.end) <= new Date(to + 'T23:59:59'));
      if (status) rows = rows.filter(r => r.status === status);
      if (kw) {
        rows = rows.filter(r =>
          (r.customerName || '').toLowerCase().includes(kw) ||
          (r.vehicleName || '').toLowerCase().includes(kw) ||
          (r.reservationId || '').toLowerCase().includes(kw)
        );
      }
      render(rows);
    }

    function render(rows) {
      const tbl = $('#tbl');
      if (!rows.length) {
        tbl.innerHTML = '<tr class="empty"><td colspan="9">該当する予約はありません</td></tr>';
        return;
      }
      tbl.innerHTML = rows.map(r => `
        <tr>
          <td><code>${escapeHtml(r.reservationId)}</code></td>
          <td><span class="status status-${r.status}">${statusLabel(r.status)}</span></td>
          <td>${formatDateTime(r.start)}</td>
          <td>${formatDateTime(r.end)}</td>
          <td>${escapeHtml(r.vehicleName)}</td>
          <td>${escapeHtml(r.vehicleId)}</td>
          <td>${escapeHtml(r.customerName)}</td>
          <td><small>${escapeHtml(r.customerEmail || '')}<br>${escapeHtml(r.customerPhone || '')}</small></td>
          <td><a href="#" class="detail-link" data-id="${escapeHtml(r.reservationId)}">詳細</a></td>
        </tr>
      `).join('');
      tbl.querySelectorAll('.detail-link').forEach(a => {
        a.addEventListener('click', e => {
          e.preventDefault();
          openDetail(a.dataset.id);
        });
      });
    }

    function openDetail(id) {
      const r = allRows.find(x => x.reservationId === id);
      if (!r) return;
      const cancelable = r.status !== 'cancelled';
      const start = new Date(r.start);
      const end = new Date(r.end);
      const days = Math.max(1, Math.ceil((end - start) / 86400000));

      const modalHtml = `
        <div class="crud-modal-bg"></div>
        <div class="crud-modal-card" style="min-width:520px">
          <div class="crud-modal-head">
            <h3>予約詳細 <code style="background:rgba(255,255,255,0.2);color:#fff;font-size:12px;margin-left:8px;padding:2px 8px;border-radius:2px">${escapeHtml(r.reservationId)}</code></h3>
            <button class="crud-close" type="button">×</button>
          </div>
          <div style="padding:18px 22px">
            <div style="display:grid;grid-template-columns:120px 1fr;gap:10px;font-size:13px">
              <div style="color:#777;font-weight:600">状態</div>
              <div><span class="status status-${r.status}">${statusLabel(r.status)}</span></div>
              <div style="color:#777;font-weight:600">車種</div>
              <div><strong>${escapeHtml(r.vehicleName)}</strong> (${escapeHtml(r.vehicleId)})</div>
              <div style="color:#777;font-weight:600">貸出</div>
              <div>${formatDateTime(r.start)}</div>
              <div style="color:#777;font-weight:600">返却</div>
              <div>${formatDateTime(r.end)} <small style="color:#888">(${days}日間)</small></div>
              <div style="color:#777;font-weight:600">借受人</div>
              <div><strong>${escapeHtml(r.customerName)}</strong> 様</div>
              <div style="color:#777;font-weight:600">メール</div>
              <div>${escapeHtml(r.customerEmail || '-')}</div>
              <div style="color:#777;font-weight:600">電話</div>
              <div>${escapeHtml(r.customerPhone || '-')}</div>
              <div style="color:#777;font-weight:600">備考</div>
              <div>${escapeHtml(r.note || '-')}</div>
              <div style="color:#777;font-weight:600">登録日時</div>
              <div>${formatDateTime(r.createdAt)}</div>
            </div>
          </div>
          <div class="crud-modal-foot">
            ${cancelable ? '<button type="button" class="btn btn-gray" id="btn-cancel-res" style="background:#c0392b">予約をキャンセル</button>' : ''}
            <span style="flex:1"></span>
            <button type="button" class="btn btn-gray crud-cancel">閉じる</button>
            <button type="button" class="btn btn-primary" onclick="window.print()">印刷</button>
          </div>
        </div>
      `;
      let modal = document.getElementById('crud-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'crud-modal';
        modal.className = 'crud-modal';
        document.body.appendChild(modal);
      }
      modal.innerHTML = modalHtml;
      const close = () => modal.remove();
      modal.querySelector('.crud-modal-bg').addEventListener('click', close);
      modal.querySelector('.crud-close').addEventListener('click', close);
      modal.querySelector('.crud-cancel').addEventListener('click', close);
      const cancelBtn = modal.querySelector('#btn-cancel-res');
      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          if (!confirm(`予約 ${r.reservationId} をキャンセルしますか?\n借受人: ${r.customerName} 様`)) return;
          if (window.SkyRentAPI.updateReservation && !window.SkyRentAPI.isConfigured) {
            window.SkyRentAPI.updateReservation(id, { status: 'cancelled' });
            alert('✓ 予約をキャンセルしました');
            close();
            load();
          } else {
            alert('GAS本番環境では Google スプレッドシートで status を cancelled に変更してください');
          }
        });
      }
    }

    function formatDateTime(s) {
      if (!s) return '';
      const d = new Date(s);
      return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
    function statusLabel(s) {
      return s === 'confirmed' ? '確定' : s === 'cancelled' ? 'キャンセル' : (s || '-');
    }
    function escapeHtml(str) {
      return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
  })();
  </script>
</body>
</html>
