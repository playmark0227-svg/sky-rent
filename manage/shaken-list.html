<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車検予約一覧 | Sky Rent 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">車検予約一覧</h1>
    <p class="page-note">車検入庫予定の管理。期限が近い車輌を優先表示します。</p>

    <section class="card kpi-row" style="margin-bottom: 16px">
      <div class="kpi kpi-1">
        <div class="kpi-label">3ヶ月以内に車検満了</div>
        <div class="kpi-value"><span id="cnt-soon">0</span><span class="kpi-unit">台</span></div>
      </div>
      <div class="kpi kpi-2">
        <div class="kpi-label">車検予約済み</div>
        <div class="kpi-value"><span id="cnt-booked">0</span><span class="kpi-unit">台</span></div>
      </div>
      <div class="kpi kpi-3">
        <div class="kpi-label">未予約</div>
        <div class="kpi-value"><span id="cnt-not-booked">0</span><span class="kpi-unit">台</span></div>
      </div>
    </section>

    <section class="card">
      <table class="data-table list">
        <thead>
          <tr>
            <th>車輌ID</th>
            <th>車種</th>
            <th>ナンバー</th>
            <th>車検満了日</th>
            <th>残日数</th>
            <th>入庫予定</th>
            <th>整備工場</th>
            <th>状態</th>
          </tr>
        </thead>
        <tbody id="tbl"><tr class="empty"><td colspan="8">読み込み中...</td></tr></tbody>
      </table>
    </section>
  </main>

  <div id="loading" class="loading" hidden><div class="spinner"></div></div>

  <script src="_partials.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
  (function () {
    document.addEventListener('DOMContentLoaded', async () => {
      document.querySelector('#loading').hidden = false;
      try {
        const vehicles = await window.SkyRentAPI.listVehicles();
        // 車検満了日はサンプル生成 (各車輌に擬似的な日付)
        const now = new Date();
        const rows = vehicles.map((v, i) => {
          const expiry = new Date(now); expiry.setMonth(expiry.getMonth() + (i*4 - 2));
          const daysLeft = Math.ceil((expiry - now) / 86400000);
          const booked = i % 2 === 0 && daysLeft < 100;
          return { ...v, expiry, daysLeft, booked };
        });

        document.querySelector('#cnt-soon').textContent = rows.filter(r => r.daysLeft <= 90 && r.daysLeft > 0).length;
        document.querySelector('#cnt-booked').textContent = rows.filter(r => r.booked).length;
        document.querySelector('#cnt-not-booked').textContent = rows.filter(r => !r.booked).length;

        document.querySelector('#tbl').innerHTML = rows.map(r => {
          const cls = r.daysLeft < 0 ? 'status-cancelled' : r.daysLeft < 90 ? 'status-soon' : 'status-confirmed';
          const label = r.daysLeft < 0 ? '期限切れ' : r.daysLeft < 90 ? '期限間近' : '正常';
          return `
            <tr>
              <td><code>${esc(r.vehicleId)}</code></td>
              <td>${esc(r.name)}</td>
              <td>${esc(r.plate||'-')}</td>
              <td>${r.expiry.getFullYear()}/${String(r.expiry.getMonth()+1).padStart(2,'0')}/${String(r.expiry.getDate()).padStart(2,'0')}</td>
              <td style="text-align:center">${r.daysLeft}日</td>
              <td>${r.booked ? '2026/05/15 10:00' : '-'}</td>
              <td>${r.booked ? '〇〇自動車整備工場' : '-'}</td>
              <td><span class="status ${cls}">${label}</span></td>
            </tr>`;
        }).join('');
      } catch (err) {
        document.querySelector('#tbl').innerHTML = `<tr class="empty"><td colspan="8">読み込み失敗: ${err.message}</td></tr>`;
      } finally {
        document.querySelector('#loading').hidden = true;
      }
    });
    function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  })();
  </script>
</body>
</html>
