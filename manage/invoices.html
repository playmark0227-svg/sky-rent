<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>請求書管理 | グロースレンタカー 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
  <style>
    /* 請求書 印刷レイアウト */
    #print-area { display: none; }
    .invoice-doc { max-width: 720px; margin: 0 auto; padding: 30px 34px; color: #222; font-size: 13px; }
    .invoice-doc h1 { text-align: center; font-size: 26px; letter-spacing: 8px; margin-bottom: 24px; border-bottom: 3px double #333; padding-bottom: 10px; }
    .inv-head { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .inv-to { font-size: 16px; }
    .inv-to .co { font-size: 20px; font-weight: 700; border-bottom: 1px solid #333; padding-bottom: 4px; display: inline-block; }
    .inv-meta { text-align: right; font-size: 12px; line-height: 1.9; }
    .inv-total-box { background: #f0f4f8; border: 1px solid #ccd; padding: 12px 16px; margin: 16px 0; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    .inv-total-box .amt { font-size: 26px; font-weight: 700; }
    table.inv-table { width: 100%; border-collapse: collapse; margin: 14px 0; }
    table.inv-table th, table.inv-table td { border: 1px solid #999; padding: 8px 10px; font-size: 12px; }
    table.inv-table th { background: #eef2f6; }
    .inv-bank { border: 1px solid #999; padding: 10px 14px; font-size: 12px; margin-top: 14px; }
    @media print {
      body > *:not(#print-area) { display: none !important; }
      #print-area { display: block !important; }
      @page { margin: 14mm; }
    }
  </style>
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">請求書管理</h1>
    <p class="page-note">法人・行政アカウント向けの請求書を発行・印刷し、入金状況を管理します。複数予約をまとめた月次一括請求にも対応します。</p>

    <section class="kpi-row" style="margin-bottom:16px">
      <div class="kpi kpi-1"><div class="kpi-label">未払い請求額</div><div class="kpi-value">¥<span id="k-unpaid">0</span></div></div>
      <div class="kpi kpi-2"><div class="kpi-label">今月発行額</div><div class="kpi-value">¥<span id="k-month">0</span></div></div>
      <div class="kpi kpi-3"><div class="kpi-label">発行済み</div><div class="kpi-value"><span id="k-count">0</span><span class="kpi-unit">件</span></div></div>
    </section>

    <div style="text-align:right;margin-bottom:10px">
      <button id="btn-add" class="btn btn-primary">+ 請求書を発行</button>
    </div>

    <section class="card">
      <table class="data-table list">
        <thead>
          <tr><th>請求書番号</th><th>宛先</th><th>案件名</th><th>対象予約</th><th style="text-align:right">金額</th><th>発行日</th><th>支払期限</th><th>状態</th><th></th></tr>
        </thead>
        <tbody id="tbl"><tr class="empty"><td colspan="9">読み込み中...</td></tr></tbody>
      </table>
    </section>
  </main>

  <div id="print-area"></div>

  <script src="partials.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/pricing.js"></script>
  <script src="../js/api.js"></script>
  <script>
  (function () {
    const S = window.SkyRentStore;
    const $ = s => document.querySelector(s);
    function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    function fmtD(iso){if(!iso)return '-';const d=new Date(iso);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate());}

    function renderKpi() {
      const inv = S.invoices();
      $('#k-unpaid').textContent = inv.filter(i => i.status === 'unpaid').reduce((s, i) => s + i.amount, 0).toLocaleString();
      const now = new Date(), ms = new Date(now.getFullYear(), now.getMonth(), 1);
      $('#k-month').textContent = inv.filter(i => new Date(i.issuedAt) >= ms).reduce((s, i) => s + i.amount, 0).toLocaleString();
      $('#k-count').textContent = inv.length;
    }

    function render() {
      renderKpi();
      const inv = S.invoices().slice().sort((a, b) => new Date(b.issuedAt) - new Date(a.issuedAt));
      if (!inv.length) { $('#tbl').innerHTML = '<tr class="empty"><td colspan="9" style="text-align:center;padding:24px;color:#888">請求書はまだありません</td></tr>'; return; }
      $('#tbl').innerHTML = inv.map(i =>
        '<tr>' +
        '<td><code>' + esc(i.invoiceId) + '</code></td>' +
        '<td>' + esc(i.company) + '</td>' +
        '<td>' + esc(i.caseName || '-') + '</td>' +
        '<td style="text-align:center">' + (i.reservationIds || []).length + '件</td>' +
        '<td style="text-align:right">¥' + i.amount.toLocaleString() + '</td>' +
        '<td>' + fmtD(i.issuedAt) + '</td>' +
        '<td>' + fmtD(i.dueDate) + '</td>' +
        '<td><span class="status ' + (i.status === 'paid' ? 'status-paid' : 'status-unpaid') + '">' + (i.status === 'paid' ? '支払済' : '未払い') + '</span></td>' +
        '<td style="text-align:center;white-space:nowrap">' +
          '<a href="#" class="detail-link" data-view="' + esc(i.invoiceId) + '">詳細</a>' +
          (i.status === 'unpaid' ? ' / <a href="#" class="detail-link" data-pay="' + esc(i.invoiceId) + '" style="color:#1e8a4a">入金確認</a>' : '') +
        '</td></tr>'
      ).join('');
      $('#tbl').querySelectorAll('[data-view]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); openView(a.dataset.view); }));
      $('#tbl').querySelectorAll('[data-pay]').forEach(a => a.addEventListener('click', e => {
        e.preventDefault();
        if (!confirm('この請求書を「支払済」にしますか?')) return;
        S.setInvoiceStatus(a.dataset.pay, 'paid'); render();
      }));
    }

    // ===== 請求書発行モーダル =====
    function openAdd() {
      const allowed = S.members().filter(m => m.invoiceAllowed);
      const html =
        '<div class="crud-modal-bg"></div><div class="crud-modal-card" style="min-width:620px">' +
        '<div class="crud-modal-head"><h3>請求書を発行</h3><button class="crud-close" type="button">×</button></div>' +
        '<div style="padding:16px 22px;max-height:70vh;overflow:auto">' +
          (allowed.length ? '' : '<p style="color:#c0392b">請求書払い許可のある会員がいません。「顧客・会員管理」で許可を付与してください。</p>') +
          '<div class="crud-field"><label>宛先会員 <span style="color:#c0392b">*</span></label><select id="i-member"><option value="">選択してください</option>' +
            allowed.map(m => '<option value="' + m.memberId + '">' + esc(m.company || m.name) + ' (' + esc(m.memberId) + ')</option>').join('') + '</select></div>' +
          '<div class="crud-field"><label>請求先住所</label><input type="text" id="i-address" placeholder="会社住所"></div>' +
          '<div class="crud-field"><label>案件名</label><input type="text" id="i-case"></div>' +
          '<div class="crud-field"><label>支払期限</label><input type="date" id="i-due"></div>' +
          '<div style="padding:10px 20px 4px"><strong class="card-section-title">請求対象の予約 <button type="button" class="btn btn-gray" id="i-selall" style="padding:3px 10px;font-size:12px;margin-left:8px">全選択</button></strong></div>' +
          '<div id="i-reslist" style="padding:0 20px 8px"><p style="color:#999;font-size:13px">会員を選択すると、未請求の予約が表示されます。</p></div>' +
          '<div class="inv-total-box" style="margin:10px 20px">請求額合計 <span class="amt" id="i-total">¥0</span></div>' +
        '</div>' +
        '<div class="crud-modal-foot"><span style="flex:1"></span><button type="button" class="btn btn-gray crud-cancel">キャンセル</button><button type="button" class="btn btn-primary" id="i-issue">発行する</button></div></div>';

      let modal = document.getElementById('crud-modal');
      if (!modal) { modal = document.createElement('div'); modal.id = 'crud-modal'; modal.className = 'crud-modal'; document.body.appendChild(modal); }
      modal.innerHTML = html;
      const close = () => modal.remove();
      modal.querySelector('.crud-modal-bg').addEventListener('click', close);
      modal.querySelector('.crud-close').addEventListener('click', close);
      modal.querySelector('.crud-cancel').addEventListener('click', close);

      // 期限初期値 = 翌月末
      const due = new Date(); due.setMonth(due.getMonth() + 2, 0);
      modal.querySelector('#i-due').value = due.toISOString().slice(0, 10);

      function recalcTotal() {
        const sum = [...modal.querySelectorAll('.i-res:checked')].reduce((s, c) => s + Number(c.dataset.amt), 0);
        modal.querySelector('#i-total').textContent = '¥' + sum.toLocaleString();
      }

      modal.querySelector('#i-member').addEventListener('change', function () {
        const m = S.getMember(this.value);
        const list = modal.querySelector('#i-resList') || modal.querySelector('#i-reslist');
        if (!m) { list.innerHTML = '<p style="color:#999;font-size:13px">会員を選択してください。</p>'; return; }
        modal.querySelector('#i-address').value = m.company ? '' : '';
        const rs = S.list('reservations').filter(r => r.memberId === m.memberId && r.status !== 'cancelled' && !r.invoiceId);
        modal.querySelector('#i-case').value = (new Date().getFullYear()) + '年' + (new Date().getMonth() + 1) + '月分 レンタル料金';
        if (!rs.length) { list.innerHTML = '<p style="color:#999;font-size:13px">未請求の予約がありません。</p>'; recalcTotal(); return; }
        list.innerHTML = rs.map(r => '<label class="opt-row" style="border-bottom:1px solid #f0f0f0;padding:8px 4px;display:flex;gap:8px;align-items:center;cursor:pointer">' +
          '<input type="checkbox" class="i-res" value="' + r.reservationId + '" data-amt="' + ((r.price && r.price.total) || 0) + '">' +
          '<span style="flex:1"><code>' + esc(r.reservationId) + '</code> ' + esc(r.assetName || r.vehicleName) + ' <small style="color:#888">' + fmtD(r.start) + '〜' + fmtD(r.end) + '</small></span>' +
          '<strong>¥' + ((r.price && r.price.total) || 0).toLocaleString() + '</strong></label>').join('');
        list.querySelectorAll('.i-res').forEach(c => c.addEventListener('change', recalcTotal));
        recalcTotal();
      });

      modal.querySelector('#i-selall').addEventListener('click', () => {
        const boxes = modal.querySelectorAll('.i-res');
        const allChecked = [...boxes].every(b => b.checked);
        boxes.forEach(b => b.checked = !allChecked);
        recalcTotal();
      });

      modal.querySelector('#i-issue').addEventListener('click', () => {
        const memberId = modal.querySelector('#i-member').value;
        if (!memberId) { alert('宛先会員を選択してください'); return; }
        const ids = [...modal.querySelectorAll('.i-res:checked')].map(c => c.value);
        if (!ids.length) { alert('請求対象の予約を選択してください'); return; }
        try {
          S.createInvoice({
            memberId: memberId, reservationIds: ids,
            company: (S.getMember(memberId).company || S.getMember(memberId).name),
            address: modal.querySelector('#i-address').value.trim(),
            caseName: modal.querySelector('#i-case').value.trim(),
            dueDate: modal.querySelector('#i-due').value ? new Date(modal.querySelector('#i-due').value + 'T00:00:00').toISOString() : null
          });
          close(); render();
        } catch (ex) { alert(ex.message); }
      });
    }

    // ===== 詳細・印刷 =====
    function invoiceDocHtml(inv) {
      const bank = S.read('settings.billing', { bankName: '', accountType: '普通', accountNo: '', holder: '' });
      const content = S.read('settings.content', {});
      const storeName = content.storeName || 'グロースレンタカー 北見本店';
      const rs = S.list('reservations').filter(r => (inv.reservationIds || []).indexOf(r.reservationId) >= 0);
      const rows = rs.map(r => '<tr><td>' + esc(r.reservationId) + '</td><td>' + esc(r.assetName || r.vehicleName) + (r.quantity > 1 ? ' × ' + r.quantity : '') + '</td><td>' + fmtD(r.start) + '〜' + fmtD(r.end) + '</td><td style="text-align:right">¥' + ((r.price && r.price.total) || 0).toLocaleString() + '</td></tr>').join('');
      const tax = Math.round(inv.amount - inv.amount / 1.1);
      return '<div class="invoice-doc">' +
        '<h1>請 求 書</h1>' +
        '<div class="inv-head"><div class="inv-to"><span class="co">' + esc(inv.company) + '</span> 御中' +
          (inv.address ? '<div style="font-size:12px;margin-top:6px">' + esc(inv.address) + '</div>' : '') + '</div>' +
          '<div class="inv-meta">請求書番号: ' + esc(inv.invoiceId) + '<br>発行日: ' + fmtD(inv.issuedAt) + '<br>支払期限: ' + fmtD(inv.dueDate) + '</div></div>' +
        '<p style="margin:10px 0">下記のとおりご請求申し上げます。件名: <strong>' + esc(inv.caseName || 'レンタル料金一式') + '</strong></p>' +
        '<div class="inv-total-box">ご請求金額 (税込) <span class="amt">¥' + inv.amount.toLocaleString() + '-</span></div>' +
        '<table class="inv-table"><thead><tr><th>予約番号</th><th>内容</th><th>期間</th><th style="text-align:right">金額</th></tr></thead><tbody>' + rows +
          '<tr><td colspan="3" style="text-align:right">小計 (税抜)</td><td style="text-align:right">¥' + (inv.amount - tax).toLocaleString() + '</td></tr>' +
          '<tr><td colspan="3" style="text-align:right">消費税 (10%)</td><td style="text-align:right">¥' + tax.toLocaleString() + '</td></tr>' +
          '<tr><td colspan="3" style="text-align:right;font-weight:700">合計</td><td style="text-align:right;font-weight:700">¥' + inv.amount.toLocaleString() + '</td></tr>' +
          '</tbody></table>' +
        '<div class="inv-bank"><strong>お振込先:</strong> ' + esc(bank.bankName || '') + ' ' + esc(bank.accountType || '') + ' ' + esc(bank.accountNo || '') + ' ' + esc(bank.holder || '') + '<div style="font-size:11px;color:#666;margin-top:4px">※振込手数料は貴社にてご負担願います。</div></div>' +
        '<div style="text-align:right;margin-top:20px;font-size:13px">' + esc(storeName) + '<br>' + esc(content.address || '北海道札幌市中央区北1条西1-1-1') + '<br>TEL: ' + esc(content.phone || '011-000-0001') + '</div>' +
        '</div>';
    }

    function openView(invoiceId) {
      const inv = S.findById('invoices', 'invoiceId', invoiceId);
      if (!inv) return;
      const html =
        '<div class="crud-modal-bg"></div><div class="crud-modal-card" style="min-width:680px;max-width:760px">' +
        '<div class="crud-modal-head"><h3>請求書 ' + esc(inv.invoiceId) + '</h3><button class="crud-close" type="button">×</button></div>' +
        '<div style="padding:10px;max-height:70vh;overflow:auto;background:#f0f0f0">' + invoiceDocHtml(inv).replace('class="invoice-doc"', 'class="invoice-doc" style="background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.1)"') + '</div>' +
        '<div class="crud-modal-foot">' +
          (inv.status === 'paid'
            ? '<button type="button" class="btn btn-gray" id="v-unpay">未払いに戻す</button>'
            : '<button type="button" class="btn btn-gray" id="v-pay" style="background:#1e8a4a">入金を記録</button>') +
          '<span style="flex:1"></span><button type="button" class="btn btn-gray crud-cancel">閉じる</button><button type="button" class="btn btn-primary" id="v-print">印刷</button></div></div>';
      let modal = document.getElementById('crud-modal');
      if (!modal) { modal = document.createElement('div'); modal.id = 'crud-modal'; modal.className = 'crud-modal'; document.body.appendChild(modal); }
      modal.innerHTML = html;
      const close = () => modal.remove();
      modal.querySelector('.crud-modal-bg').addEventListener('click', close);
      modal.querySelector('.crud-close').addEventListener('click', close);
      modal.querySelector('.crud-cancel').addEventListener('click', close);
      modal.querySelector('#v-print').addEventListener('click', () => {
        $('#print-area').innerHTML = invoiceDocHtml(inv);
        window.print();
      });
      const pay = modal.querySelector('#v-pay'); if (pay) pay.addEventListener('click', () => { S.setInvoiceStatus(invoiceId, 'paid'); close(); render(); });
      const unpay = modal.querySelector('#v-unpay'); if (unpay) unpay.addEventListener('click', () => { S.setInvoiceStatus(invoiceId, 'unpaid'); close(); render(); });
    }

    document.addEventListener('DOMContentLoaded', () => {
      $('#btn-add').addEventListener('click', openAdd);
      render();
    });
  })();
  </script>
</body>
</html>
