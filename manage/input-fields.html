<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入力項目管理 | Sky Rent 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">入力項目管理</h1>
    <p class="page-note">予約フォームに表示する項目をカスタマイズします。「必須」「表示」を編集してください。</p>

    <div style="text-align:right;margin-bottom:10px">
      <button id="btn-add" class="btn btn-primary">+ 項目を追加</button>
    </div>

    <section class="card">
      <table class="data-table list">
        <thead>
          <tr>
            <th>項目ID</th>
            <th>項目名</th>
            <th>入力タイプ</th>
            <th>必須</th>
            <th>表示</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbl"></tbody>
      </table>
    </section>

    <section class="card" style="margin-top:18px;padding:20px">
      <h3 style="margin-bottom:10px;color:var(--primary);font-size:15px">使えるフィールドタイプ</h3>
      <table class="info-table" style="font-size:13px">
        <tr><th>テキスト</th><td>1行入力</td></tr>
        <tr><th>テキストエリア</th><td>複数行入力</td></tr>
        <tr><th>メール</th><td>メールアドレス形式の検証</td></tr>
        <tr><th>電話</th><td>数字とハイフンのみ</td></tr>
        <tr><th>日付</th><td>カレンダーピッカー</td></tr>
        <tr><th>セレクト</th><td>選択肢から1つ</td></tr>
        <tr><th>チェックボックス</th><td>同意確認</td></tr>
      </table>
    </section>
  </main>

  <script src="partials.js"></script>
  <script src="js/crud.js"></script>
  <script>
  SkyRentCRUD.init({
    storageKey: 'input-fields',
    idPrefix: 'F',
    columns: [
      { key: 'id', label: '項目ID', code: true, readonly: true },
      { key: 'name', label: '項目名', bold: true, required: true },
      { key: 'fieldType', label: '入力タイプ', type: 'select', options: ['テキスト','テキストエリア','メール','電話','日付','セレクト','チェックボックス'] },
      { key: 'required', label: '必須', type: 'checkbox', center: true },
      { key: 'visible', label: '表示', type: 'checkbox', center: true }
    ],
    defaults: [
      { id: 'F001', name: 'お名前',             fieldType: 'テキスト',       required: true,  visible: true },
      { id: 'F002', name: 'お名前 (フリガナ)',  fieldType: 'テキスト',       required: false, visible: true },
      { id: 'F003', name: 'メールアドレス',     fieldType: 'メール',         required: true,  visible: true },
      { id: 'F004', name: '電話番号',           fieldType: '電話',           required: true,  visible: true },
      { id: 'F005', name: '住所',               fieldType: 'テキスト',       required: false, visible: false },
      { id: 'F006', name: '運転免許証番号',     fieldType: 'テキスト',       required: false, visible: false },
      { id: 'F007', name: '生年月日',           fieldType: '日付',           required: false, visible: false },
      { id: 'F008', name: '到着便 (空港送迎用)',fieldType: 'テキスト',       required: false, visible: false },
      { id: 'F009', name: '備考',               fieldType: 'テキストエリア', required: false, visible: true },
      { id: 'F010', name: '利用規約への同意',   fieldType: 'チェックボックス', required: true,  visible: true }
    ]
  });
  </script>
</body>
</html>
