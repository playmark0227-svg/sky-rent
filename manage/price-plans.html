<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>料金プラン管理 | グロースレンタカー 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">料金プラン管理</h1>
    <p class="page-note">時期や利用条件に応じた料金プラン。</p>

    <div style="text-align:right;margin-bottom:10px">
      <button id="btn-add" class="btn btn-primary">+ 新規プラン</button>
    </div>

    <section class="card">
      <table class="data-table list">
        <thead><tr><th>プランID</th><th>プラン名</th><th>適用期間</th><th>割引内容</th><th>対象クラス</th><th>状態</th><th></th></tr></thead>
        <tbody id="tbl"></tbody>
      </table>
    </section>
  </main>

  <script src="partials.js"></script>
  <script src="js/crud.js"></script>
  <script>
  SkyRentCRUD.init({
    storageKey: 'price-plans',
    idPrefix: 'P',
    columns: [
      { key: 'id', label: 'プランID', code: true, readonly: true },
      { key: 'name', label: 'プラン名', bold: true, required: true },
      { key: 'period', label: '適用期間' },
      { key: 'discount', label: '割引内容' },
      { key: 'targetClass', label: '対象クラス', type: 'select', options: ['全クラス','コンパクト','ミドル','ミニバン','SUV'] },
      { key: 'active', label: '状態', type: 'status' }
    ],
    defaults: [
      { id: 'P001', name: '早割30',       period: '30日前〜',       discount: '15%OFF', targetClass: '全クラス', active: true },
      { id: 'P002', name: '早割7',        period: '7日前〜',        discount: '5%OFF',  targetClass: '全クラス', active: true },
      { id: 'P003', name: '3連泊割引',    period: '3泊以上',        discount: '10%OFF', targetClass: '全クラス', active: true },
      { id: 'P004', name: '平日割',       period: '月〜木曜出発',   discount: '8%OFF',  targetClass: '全クラス', active: true },
      { id: 'P005', name: 'GW特別料金',   period: '2026/04/29〜05/06', discount: '+30%', targetClass: '全クラス', active: true },
      { id: 'P006', name: '夏休みプラン', period: '2026/07/20〜08/31', discount: '+20%', targetClass: '全クラス', active: false }
    ]
  });
  </script>
</body>
</html>
