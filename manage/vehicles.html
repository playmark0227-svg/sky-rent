<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車輌管理 | Sky Rent 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">車輌管理</h1>
    <p class="page-note">車輌の追加・編集は Google スプレッドシート「車両マスタ」シートで行います。本画面は閲覧専用です。</p>

    <section class="card">
      <table class="data-table list">
        <thead>
          <tr>
            <th>車輌ID</th>
            <th>車種</th>
            <th>クラス</th>
            <th>ナンバー</th>
            <th>定員</th>
            <th>料金/日</th>
            <th>状態</th>
          </tr>
        </thead>
        <tbody id="tbl"><tr class="empty"><td colspan="7">読み込み中...</td></tr></tbody>
      </table>
    </section>
  </main>

  <div id="loading" class="loading" hidden><div class="spinner"></div></div>

  <script src="partials.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
  (function () {
    document.addEventListener('DOMContentLoaded', async () => {
      const tbl = document.querySelector('#tbl');
      document.querySelector('#loading').hidden = false;
      try {
        const rows = await window.SkyRentAPI.listVehicles();
        if (!rows.length) {
          tbl.innerHTML = '<tr class="empty"><td colspan="7">車輌が登録されていません</td></tr>';
        } else {
          tbl.innerHTML = rows.map(v => `
            <tr>
              <td><code>${esc(v.vehicleId)}</code></td>
              <td><strong>${esc(v.name)}</strong></td>
              <td>${esc(v.class||'')}</td>
              <td>${esc(v.plate||'')}</td>
              <td style="text-align:center">${v.capacity || '-'}名</td>
              <td>¥${(Number(v.pricePerDay)||0).toLocaleString()}</td>
              <td><span class="status status-confirmed">稼働中</span></td>
            </tr>
          `).join('');
        }
      } catch (err) {
        tbl.innerHTML = `<tr class="empty"><td colspan="7">読み込み失敗: ${err.message}</td></tr>`;
      } finally {
        document.querySelector('#loading').hidden = true;
      }
    });
    function esc(str) { return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  })();
  </script>
</body>
</html>
