<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車輌管理 | Sky Rent 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">車輌管理</h1>
    <p class="page-note">登録車輌の追加・編集・削除を行います。ここで編集した内容は予約サイトの空車検索にも即反映されます。</p>

    <div style="text-align:right;margin-bottom:10px">
      <button id="btn-add" class="btn btn-primary">+ 車輌追加</button>
    </div>

    <section class="card">
      <table class="data-table list">
        <thead>
          <tr>
            <th>車輌ID</th>
            <th>車種</th>
            <th>クラス</th>
            <th>ナンバー</th>
            <th>定員</th>
            <th>料金/日</th>
            <th>状態</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbl"></tbody>
      </table>
    </section>
  </main>

  <script src="partials.js"></script>
  <script src="js/crud.js"></script>
  <script>
  SkyRentCRUD.init({
    storageKey: 'vehicles',
    idPrefix: 'V',
    columns: [
      { key: 'vehicleId', label: '車輌ID', code: true, readonly: true },
      { key: 'name', label: '車種', bold: true, required: true },
      { key: 'class', label: 'クラス', type: 'select', options: ['コンパクト','ミドル','ミニバン','SUV','軽自動車','バン','トラック','マイクロバス','二輪'] },
      { key: 'plate', label: 'ナンバー' },
      { key: 'capacity', label: '定員', type: 'number', center: true,
        format: v => v ? v + '名' : '-' },
      { key: 'pricePerDay', label: '料金/日', type: 'number',
        format: SkyRentCRUD.helpers.yen },
      { key: 'active', label: '状態', type: 'status',
        statusLabel: v => v === true || v === 'true' ? '稼働中' : '休止中' }
    ],
    defaults: [
      { vehicleId: 'V001', name: 'コンパクト (ヴィッツ等)', class: 'コンパクト', plate: '札幌 500 あ 1234', capacity: 5, pricePerDay: 5500,  active: true },
      { vehicleId: 'V002', name: 'ミドル (カローラ等)',     class: 'ミドル',     plate: '札幌 500 あ 5678', capacity: 5, pricePerDay: 7700,  active: true },
      { vehicleId: 'V003', name: 'ミニバン (ノア等)',       class: 'ミニバン',   plate: '札幌 500 あ 9012', capacity: 7, pricePerDay: 11000, active: true },
      { vehicleId: 'V004', name: 'SUV (ハリアー等)',        class: 'SUV',        plate: '札幌 500 あ 3456', capacity: 5, pricePerDay: 13200, active: true }
    ]
  });

  // 注: storageKey が 'vehicles' なので localStorage の sky-rent.vehicles に保存
  // js/api.js の listVehicles() が同じキーを参照するため、予約サイトに即反映される
  </script>
</body>
</html>
