<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カスタムページ管理 | グロースレンタカー 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">カスタムページ管理</h1>
    <p class="page-note">予約サイトに任意の固定ページを追加できます (利用規約、プライバシーポリシー、よくある質問など)。</p>

    <div style="text-align:right;margin-bottom:10px">
      <button id="btn-add" class="btn btn-primary">+ 新規ページ作成</button>
    </div>

    <section class="card">
      <table class="data-table list">
        <thead><tr><th>ページID</th><th>タイトル</th><th>URL</th><th>更新日</th><th>状態</th><th></th></tr></thead>
        <tbody id="tbl"></tbody>
      </table>
    </section>
  </main>

  <script src="partials.js"></script>
  <script src="js/crud.js"></script>
  <script>
  SkyRentCRUD.init({
    storageKey: 'custom-pages',
    idPrefix: 'P',
    columns: [
      { key: 'id', label: 'ページID', code: true, readonly: true },
      { key: 'title', label: 'タイトル', bold: true, required: true },
      { key: 'url', label: 'URL', required: true },
      { key: 'body', label: '本文', type: 'textarea' },
      { key: 'updatedAt', label: '更新日', type: 'date' },
      { key: 'active', label: '状態', type: 'status',
        statusLabel: v => v === true || v === 'true' ? '公開' : '下書き' }
    ],
    defaults: [
      { id: 'P01', title: '利用規約',                     url: '/terms',         body: 'グロースレンタカー ご利用規約\n\n第1条 (目的)...', updatedAt: '2026-04-15', active: true },
      { id: 'P02', title: 'プライバシーポリシー',         url: '/privacy',       body: '...',                                       updatedAt: '2026-04-15', active: true },
      { id: 'P03', title: 'よくあるご質問',               url: '/faq',           body: 'Q. 予約はいつまでに?\nA. ...',              updatedAt: '2026-04-20', active: true },
      { id: 'P04', title: '会社概要',                     url: '/company',       body: '株式会社グロースレンタカー...',                       updatedAt: '2026-04-01', active: true },
      { id: 'P05', title: 'キャンセル規定',               url: '/cancel-policy', body: '7日前まで無料...',                          updatedAt: '2026-04-10', active: true },
      { id: 'P06', title: '特定商取引法に基づく表記',     url: '/legal',         body: '販売事業者: ...',                           updatedAt: '2026-04-01', active: true },
      { id: 'P07', title: 'キャンペーン情報',             url: '/campaign',      body: '夏のキャンペーン...',                       updatedAt: '2026-04-25', active: false }
    ]
  });
  </script>
</body>
</html>
