<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>請求情報 | Sky Rent 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">請求情報</h1>
    <p class="page-note">Sky Rent システムの月額利用料金と請求履歴。</p>

    <!-- 現在のプラン -->
    <section class="kpi-row" style="margin-bottom: 16px">
      <div class="kpi kpi-1">
        <div class="kpi-label">現在のプラン</div>
        <div class="kpi-value" style="font-size:28px;line-height:1.4">STD+</div>
      </div>
      <div class="kpi kpi-2">
        <div class="kpi-label">今月のご請求額</div>
        <div class="kpi-value"><span>11,000</span><span class="kpi-unit">円</span></div>
      </div>
      <div class="kpi kpi-3">
        <div class="kpi-label">次回請求日</div>
        <div class="kpi-value" style="font-size:24px">2026/05/01</div>
      </div>
    </section>

    <section class="card" style="padding:20px;margin-bottom:14px">
      <h3 style="margin-bottom:14px;font-size:15px;color:var(--primary)">プラン詳細</h3>
      <table class="info-table">
        <tr><th>プラン名</th><td><strong>STD+ プラン</strong> (¥11,000/月 税込)</td></tr>
        <tr><th>契約開始日</th><td>2024/04/01</td></tr>
        <tr><th>支払方法</th><td>クレジットカード (•••• 1234)</td></tr>
        <tr><th>登録車両数</th><td><span id="vehicle-count">-</span></td></tr>
        <tr><th>含まれる機能</th><td>予約管理 / 顧客管理 / 車輌管理 / 売上集計 / 公式様式エクセル出力 / 全管理機能</td></tr>
      </table>
      <div style="margin-top:14px;text-align:right">
        <button class="btn btn-gray" onclick="alert('プラン変更ご希望の場合は support@sky-rent.example.com までご連絡ください')">プランを変更</button>
        <button class="btn btn-gray" onclick="alert('支払い方法の変更画面（要実装）')">支払方法を変更</button>
      </div>
    </section>

    <section class="card">
      <h3 style="padding:14px 20px;font-size:15px;color:var(--primary);border-bottom:1px solid var(--border)">請求履歴</h3>
      <table class="data-table list">
        <thead>
          <tr><th>請求月</th><th>請求金額</th><th>支払日</th><th>状態</th><th>請求書</th></tr>
        </thead>
        <tbody id="invoice-list"></tbody>
      </table>
    </section>
  </main>

  <script src="partials.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
    // 車両数を取得
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const v = await window.SkyRentAPI.listVehicles();
        document.querySelector('#vehicle-count').textContent = v.length + ' 台 (上限なし)';
      } catch (e) {
        document.querySelector('#vehicle-count').textContent = '-';
      }
    });

    // 過去12ヶ月の請求履歴生成
    const now = new Date();
    const rows = [];
    for (let i = 0; i < 12; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const ym = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}`;
      const paidDate = new Date(d.getFullYear(), d.getMonth(), 27);
      const isPaid = paidDate <= now;
      const isCurrent = i === 0;
      rows.push(`
        <tr>
          <td><strong>${ym}</strong></td>
          <td>¥11,000</td>
          <td>${isPaid ? `${paidDate.getFullYear()}/${String(paidDate.getMonth()+1).padStart(2,'0')}/27` : '-'}</td>
          <td><span class="status ${isCurrent ? 'status-soon' : isPaid ? 'status-confirmed' : 'status-cancelled'}">${isCurrent ? '請求中' : isPaid ? '支払済' : '未払'}</span></td>
          <td><a href="#" class="detail-link" onclick="event.preventDefault();window.print()">PDF</a></td>
        </tr>`);
    }
    document.querySelector('#invoice-list').innerHTML = rows.join('');
  </script>
</body>
</html>
