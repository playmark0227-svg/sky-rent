<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オプション管理 | Sky Rent 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">オプション管理</h1>
    <p class="page-note">予約時に追加できるオプション品目。</p>

    <div style="text-align:right;margin-bottom:10px">
      <button id="btn-add" class="btn btn-primary">+ オプション追加</button>
    </div>

    <section class="card">
      <table class="data-table list">
        <thead><tr><th>ID</th><th>名称</th><th>料金</th><th>課金単位</th><th>在庫</th><th>必須</th><th>状態</th><th></th></tr></thead>
        <tbody id="tbl"></tbody>
      </table>
    </section>
  </main>

  <script src="partials.js"></script>
  <script src="js/crud.js"></script>
  <script>
  SkyRentCRUD.init({
    storageKey: 'options',
    idPrefix: 'OP',
    columns: [
      { key: 'id', label: 'ID', code: true, readonly: true },
      { key: 'name', label: '名称', bold: true, required: true },
      { key: 'price', label: '料金', type: 'number', format: SkyRentCRUD.helpers.yen },
      { key: 'unit', label: '課金単位', type: 'select', options: ['1日','1回','期間中','無制限'] },
      { key: 'stock', label: '在庫' },
      { key: 'recommend', label: '必須/推奨', type: 'select', options: ['-','推奨','必須'] },
      { key: 'active', label: '状態', type: 'status' }
    ],
    defaults: [
      { id: 'OP01', name: 'チャイルドシート',  price: 1100, unit: '1回', stock: '10個',    recommend: '-',   active: true },
      { id: 'OP02', name: 'ジュニアシート',    price: 1100, unit: '1回', stock: '5個',     recommend: '-',   active: true },
      { id: 'OP03', name: 'ETCカード貸出',     price: 330,  unit: '1日', stock: '20枚',    recommend: '-',   active: true },
      { id: 'OP04', name: 'スタッドレスタイヤ',price: 2200, unit: '1日', stock: '4台分',   recommend: '-',   active: true },
      { id: 'OP05', name: '免責補償(CDW)',     price: 1650, unit: '1日', stock: '無制限',  recommend: '推奨',active: true },
      { id: 'OP06', name: 'NOC補償',           price: 550,  unit: '1日', stock: '無制限',  recommend: '-',   active: true },
      { id: 'OP07', name: 'ペット同乗',        price: 3300, unit: '1回', stock: '-',       recommend: '-',   active: true }
    ]
  });
  </script>
</body>
</html>
