<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オプション管理 | グロースレンタカー 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">オプション管理</h1>
    <p class="page-note">補償オプション (免責補償制度・安心保証コースなど、カテゴリ専用) と、装備オプション (ポータブル電源・家電セットなど、全車両カテゴリ共通) を管理します。装備オプションは、家電レンタル (車を借りない、家電だけのレンタル) で借りる家電にもなります。<strong>在庫数</strong>は同じ時間に貸し出せる数で、車両のオプションと家電だけの予約で同じ在庫を使います (空欄 = 在庫を数えない。家電セットは空欄にして、中の品目の在庫を使います)。新しいカテゴリを追加した際も、ここからオプションを紐付けられます。</p>

    <section class="card filter-bar">
      <div class="filter-group"><label>種類</label>
        <select id="f-kind"><option value="">すべて</option><option value="cover">補償オプション</option><option value="other">装備オプション</option></select>
      </div>
      <div class="filter-group"><label>適用範囲</label>
        <select id="f-scope"><option value="">すべて</option><option value="common">共通のみ</option></select>
      </div>
      <span style="flex:1"></span>
      <button id="btn-add" class="btn btn-primary">+ オプション追加</button>
    </section>

    <section class="card">
      <table class="data-table list">
        <thead>
          <tr><th>オプション名</th><th>種類</th><th>料金</th><th>課金単位</th><th>適用範囲</th><th>在庫数</th><th>状態</th><th></th></tr>
        </thead>
        <tbody id="tbl"><tr class="empty"><td colspan="8">読み込み中...</td></tr></tbody>
      </table>
    </section>
  </main>

  <script src="partials.js"></script>

  <script src="../js/config.js?v=20261003"></script>
  <script src="../js/store.js?v=20261003"></script>
  <script src="../js/pricing-core.js?v=20261003"></script>
  <script src="../js/pricing.js?v=20261003"></script>
  <script src="../js/api.js?v=20261003"></script>
  <script src="../js/backend.js?v=20261003"></script>
  <script src="../js/boot.js?v=20261003"></script>
  <script type="text/x-deferred">
  (function () {
    const S = window.SkyRentStore;
    const $ = s => document.querySelector(s);
    function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    const unitLabel = t => t === 'per_rental' ? '1回' : '24時間あたり';
    // 種類: kind='cover' = 補償オプション (1つだけ選べる) / それ以外 = 装備オプション
    //   kind の無い古いデータは「補償の1つだけ選べるグループ」かで判断する (画面 detail.html と同じ)
    const isCover = o => o.kind ? o.kind === 'cover' : o.exclusiveGroup === 'cover';
    const kindLabel = o => isCover(o) ? '補償' : '装備';
    function sorted(arr) {
      return arr.map((o, i) => ({ o: o, i: i }))
        .sort((a, b) => ((a.o.sort == null ? 99 : Number(a.o.sort)) - (b.o.sort == null ? 99 : Number(b.o.sort))) || (a.i - b.i))
        .map(x => x.o);
    }
    function optName(id) { const x = S.findById('options', 'optionId', id); return x ? x.name : id; }
    // 在庫数 (同じ時間に貸し出せる数)。null・空 = 数えない
    function stockOf(o) {
      if (o.stock == null || o.stock === '') return null;
      const n = Number(o.stock);
      return isFinite(n) ? n : null;
    }
    function stockCell(o) {
      const n = stockOf(o);
      if (n != null) return '<span data-stock>' + esc(n) + '</span>';
      if (Array.isArray(o.includes) && o.includes.length) return '<span data-stock style="color:#888">中の品目の在庫</span>';
      return '<span data-stock style="color:#bbb">数えない</span>';
    }

    function initFilter() {
      const cats = S.categories(true);
      $('#f-scope').innerHTML = '<option value="">すべて</option><option value="common">共通のみ</option>' + cats.map(c => '<option value="' + c.categoryId + '">' + esc(c.name) + '</option>').join('');
      $('#f-scope').addEventListener('change', render);
      $('#f-kind').addEventListener('change', render);
    }

    function scopeCell(o) {
      if (o.categoryIds == null) return '<span class="chip chip-common">共通 (全車両)</span>';
      return o.categoryIds.map(id => { const c = S.getCategory(id); return '<span class="chip">' + esc(c ? c.name : id) + '</span>'; }).join('');
    }

    function render() {
      const scope = $('#f-scope').value, kind = $('#f-kind').value;
      let arr = sorted(S.list('options'));
      if (scope === 'common') arr = arr.filter(o => o.categoryIds == null);
      else if (scope) arr = arr.filter(o => Array.isArray(o.categoryIds) && o.categoryIds.indexOf(scope) >= 0);
      if (kind) arr = arr.filter(o => (kind === 'cover') === isCover(o));
      if (!arr.length) { $('#tbl').innerHTML = '<tr class="empty"><td colspan="8" style="text-align:center;padding:24px;color:#888">該当なし</td></tr>'; return; }
      $('#tbl').innerHTML = arr.map(o =>
        '<tr data-id="' + esc(o.optionId) + '">' +
        '<td><strong>' + esc(o.name) + '</strong>' +
          (o.description ? '<br><small style="color:#777">' + esc(o.description) + '</small>' : '') +
          (Array.isArray(o.includes) && o.includes.length ? '<br><small style="color:#777" data-includes>含む品目: ' + o.includes.map(id => esc(optName(id))).join('・') + '</small>' : '') + '</td>' +
        '<td><span class="chip' + (isCover(o) ? '' : ' chip-common') + '">' + kindLabel(o) + '</span></td>' +
        '<td>¥' + Number(o.price).toLocaleString() + '</td>' +
        '<td>' + unitLabel(o.priceType) + '</td>' +
        '<td>' + scopeCell(o) + '</td>' +
        '<td style="text-align:center">' + stockCell(o) + '</td>' +
        '<td><span class="status ' + (o.active !== false ? 'status-confirmed' : 'status-cancelled') + '">' + (o.active !== false ? '有効' : '無効') + '</span></td>' +
        '<td style="text-align:center"><a href="#" class="detail-link" data-edit="' + esc(o.optionId) + '">編集</a></td>' +
        '</tr>'
      ).join('');
      $('#tbl').querySelectorAll('[data-edit]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); openModal(a.dataset.edit); }));
    }

    function openModal(optionId) {
      const isNew = !optionId;
      const o = isNew
        ? { optionId: '', name: '', price: '', priceType: 'per_day', categoryIds: null, kind: 'other', active: true }
        : Object.assign({}, S.findById('options', 'optionId', optionId));
      const cats = S.categories(true);
      const isCommon = o.categoryIds == null;
      const cover = isCover(o);
      // セット (家電セットなど) に含める品目の候補: 自分以外の装備オプション。
      // いま含めている品目が一覧に無い (削除済みなど) 場合も、保存で消えないよう候補に残す
      const incl = Array.isArray(o.includes) ? o.includes.map(String) : [];
      const inclCands = sorted(S.list('options')).filter(x => x.optionId !== o.optionId && !isCover(x)).map(x => ({ id: x.optionId, name: x.name }));
      incl.filter(id => id !== o.optionId && !inclCands.some(c => c.id === id))
        .forEach(id => inclCands.push({ id: id, name: optName(id) === id ? id + ' (一覧に無い品目)' : optName(id) }));

      const html =
        '<div class="crud-modal-bg"></div><div class="crud-modal-card">' +
        '<div class="crud-modal-head"><h3>' + (isNew ? 'オプション追加' : '編集') + '</h3><button class="crud-close" type="button">×</button></div>' +
        '<div style="padding:6px 0">' +
          '<div class="crud-field"><label>名称 <span style="color:#c0392b">*</span></label><input type="text" id="o-name" value="' + esc(o.name) + '"></div>' +
          '<div class="crud-field"><label>種類</label><select id="o-kind"><option value="other"' + (cover ? '' : ' selected') + '>装備オプション (他と一緒に選べる)</option><option value="cover"' + (cover ? ' selected' : '') + '>補償オプション (1つだけ選べる)</option></select></div>' +
          '<div class="crud-field"><label>説明</label><input type="text" id="o-desc" maxlength="200" placeholder="例: 機種・型番、セットの内容" value="' + esc(o.description || '') + '"></div>' +
          '<div class="crud-field"><label>料金 (円) <span style="color:#c0392b">*</span></label><input type="number" id="o-price" value="' + (o.price || '') + '"></div>' +
          '<div class="crud-field" id="o-stock-wrap" style="align-items:flex-start' + (cover ? ';display:none' : '') + '"><label style="padding-top:6px">在庫数</label><div style="flex:1">' +
            '<input type="number" id="o-stock" min="0" step="1" style="max-width:120px" placeholder="数えない" value="' + (stockOf(o) == null ? '' : esc(stockOf(o))) + '">' +
            '<small style="display:block;color:#777;margin-top:4px">同じ時間に貸し出せる数です。車両のオプションと家電だけの予約 (家電レンタル) で同じ在庫を使い、足りない日時は予約できません。空欄にすると数えません (家電セットは空欄にして、中の品目の在庫を使います)。</small></div></div>' +
          '<div class="crud-field"><label>課金単位</label><select id="o-type"><option value="per_day"' + (o.priceType !== 'per_rental' ? ' selected' : '') + '>24時間あたり</option><option value="per_rental"' + (o.priceType === 'per_rental' ? ' selected' : '') + '>1回</option></select></div>' +
          '<div class="crud-field"><label>状態</label><select id="o-active"><option value="true"' + (o.active !== false ? ' selected' : '') + '>有効</option><option value="false"' + (o.active === false ? ' selected' : '') + '>無効</option></select></div>' +
          '<div class="crud-field" style="align-items:flex-start"><label style="padding-top:2px">適用範囲</label><div style="flex:1">' +
            '<label style="display:block;margin-bottom:6px"><input type="radio" name="o-scope" value="common"' + (isCommon ? ' checked' : '') + '> 共通 (全車両カテゴリ)</label>' +
            '<label style="display:block;margin-bottom:6px"><input type="radio" name="o-scope" value="specific"' + (!isCommon ? ' checked' : '') + '> カテゴリを指定</label>' +
            '<div id="cat-checks" class="chk-group" style="margin-top:6px;padding-left:18px' + (isCommon ? ';opacity:.4' : '') + '">' +
              cats.map(c => '<label><input type="checkbox" value="' + c.categoryId + '"' + (!isCommon && o.categoryIds.indexOf(c.categoryId) >= 0 ? ' checked' : '') + '> ' + esc(c.name) + (c.type === 'item' ? ' (物品)' : '') + '</label>').join('') +
            '</div></div></div>' +
          '<div class="crud-field" id="o-includes-wrap" style="align-items:flex-start' + (cover ? ';display:none' : '') + '"><label style="padding-top:2px">セットに含む品目</label><div style="flex:1">' +
            '<small style="display:block;color:#777;margin-bottom:6px">セット (家電セットなど) のときだけ選びます。お客様は、セットと、ここで選んだ品目を同時には選べません (二重請求を防ぐため)。</small>' +
            '<div id="o-includes" class="chk-group">' +
              (inclCands.length ? inclCands.map(x => '<label><input type="checkbox" value="' + esc(x.id) + '"' + (incl.indexOf(x.id) >= 0 ? ' checked' : '') + '> ' + esc(x.name) + '</label>').join('') : '<span style="color:#888">候補がありません</span>') +
            '</div></div></div>' +
        '</div>' +
        '<div class="crud-modal-foot">' +
          (isNew ? '' : '<button type="button" class="btn btn-gray" id="o-delete" style="background:#c0392b">削除</button>') +
          '<span style="flex:1"></span><button type="button" class="btn btn-gray crud-cancel">キャンセル</button><button type="button" class="btn btn-primary" id="o-save">保存</button>' +
        '</div></div>';

      let modal = document.getElementById('crud-modal');
      if (!modal) { modal = document.createElement('div'); modal.id = 'crud-modal'; modal.className = 'crud-modal'; document.body.appendChild(modal); }
      modal.innerHTML = html;
      const close = () => modal.remove();
      modal.querySelector('.crud-modal-bg').addEventListener('click', close);
      modal.querySelector('.crud-close').addEventListener('click', close);
      modal.querySelector('.crud-cancel').addEventListener('click', close);

      const checks = modal.querySelector('#cat-checks');
      modal.querySelectorAll('input[name="o-scope"]').forEach(r => r.addEventListener('change', () => {
        checks.style.opacity = modal.querySelector('input[name="o-scope"]:checked').value === 'common' ? '.4' : '1';
      }));
      modal.querySelector('#o-kind').addEventListener('change', () => {
        const coverNow = modal.querySelector('#o-kind').value === 'cover';
        modal.querySelector('#o-includes-wrap').style.display = coverNow ? 'none' : '';
        modal.querySelector('#o-stock-wrap').style.display = coverNow ? 'none' : '';
      });

      modal.querySelector('#o-save').addEventListener('click', () => {
        const name = modal.querySelector('#o-name').value.trim();
        const price = modal.querySelector('#o-price').value;
        if (!name) { alert('名称は必須です'); return; }
        if (price === '') { alert('料金は必須です'); return; }
        const kindNow = modal.querySelector('#o-kind').value;
        const stockRaw = kindNow === 'cover' ? '' : String(modal.querySelector('#o-stock').value).trim();
        const stockNum = stockRaw === '' ? null : Number(stockRaw);
        if (stockNum != null && !(isFinite(stockNum) && stockNum >= 0 && Math.floor(stockNum) === stockNum)) { alert('在庫数は 0 以上の整数で入力してください (数えない場合は空欄)'); return; }
        const scope = modal.querySelector('input[name="o-scope"]:checked').value;
        let categoryIds = null;
        if (scope === 'specific') {
          categoryIds = [...checks.querySelectorAll('input:checked')].map(c => c.value);
          if (!categoryIds.length) { alert('適用するカテゴリを1つ以上選択してください'); return; }
        }
        const kind = modal.querySelector('#o-kind').value;
        const obj = {
          optionId: isNew ? S.genId('OP', 'options', 'optionId') : o.optionId,
          name: name, price: Number(price), priceType: modal.querySelector('#o-type').value,
          categoryIds: categoryIds, active: modal.querySelector('#o-active').value === 'true',
          kind: kind,
          // 補償は同じグループ ('cover') から1つだけ。装備にしたら補償のグループから外す
          exclusiveGroup: kind === 'cover' ? (o.exclusiveGroup || 'cover') : (o.exclusiveGroup === 'cover' ? null : (o.exclusiveGroup || null))
        };
        // 説明・セットの品目 (DB では extra.description / extra.includes)。画面に無い項目 (短時間料金・並び順など) は元の値のまま残る
        const desc = modal.querySelector('#o-desc').value.trim();
        if (desc || o.description != null) obj.description = desc || null;
        const inclIds = kind === 'cover' ? [] : [...modal.querySelectorAll('#o-includes input:checked')].map(c => c.value);
        if (inclIds.length) obj.includes = inclIds;
        else if (o.includes != null) obj.includes = null;
        // 在庫数 (空欄 = 数えない)。もともと項目の無いデータで空欄のままなら送らない
        if (stockNum != null || o.stock !== undefined) obj.stock = stockNum;
        S.upsert('options', 'optionId', obj);
        close(); render();
      });

      const del = modal.querySelector('#o-delete');
      if (del) del.addEventListener('click', () => { if (!confirm('「' + o.name + '」を削除しますか?')) return; S.removeById('options', 'optionId', o.optionId); close(); render(); });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initFilter();
      $('#btn-add').addEventListener('click', () => openModal(null));
      render();
    });
  })();
  </script>
</body>
</html>
