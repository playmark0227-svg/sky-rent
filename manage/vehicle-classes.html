<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クラス管理 | Sky Rent 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">クラス管理</h1>
    <p class="page-note">車両の料金クラスを管理します。</p>

    <section class="card">
      <table class="data-table list">
        <thead><tr><th>クラスID</th><th>クラス名</th><th>料金/日 (基準)</th><th>説明</th></tr></thead>
        <tbody>
          <tr><td><code>K1</code></td><td><strong>コンパクト</strong></td><td>¥5,500</td><td>ヴィッツ・フィット等</td></tr>
          <tr><td><code>K2</code></td><td><strong>ミドル</strong></td><td>¥7,700</td><td>カローラ・プリウス等</td></tr>
          <tr><td><code>K3</code></td><td><strong>ミニバン</strong></td><td>¥11,000</td><td>ノア・セレナ等</td></tr>
          <tr><td><code>K4</code></td><td><strong>SUV</strong></td><td>¥13,200</td><td>ハリアー・CX-5等</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="partials.js"></script>
</body>
</html>
