<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カテゴリ管理 | Sky Rent 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">カテゴリ管理</h1>
    <p class="page-note">車両・物品のカテゴリと、カテゴリ固有のカスタム項目 (スペック欄・検索フィルタ) を、エンジニア不要で自由に追加・編集できます。ここで追加したカテゴリ・項目は予約サイトの検索条件・詳細ページに自動反映されます。</p>

    <div class="card" style="background:#eef4fa;border-color:#d4e2ef;padding:14px 18px;margin-bottom:14px">
      <strong style="color:var(--primary)">💡 拡張のしかた</strong>
      <p style="font-size:12px;color:#555;margin-top:6px;line-height:1.7">
        例: 「冷凍車」カテゴリを追加 → カスタム項目に『庫内温度帯 (select)』『庫内容積 (number, L)』を定義 →
        「車両・物品管理」から車両を登録 (定義した項目の入力欄が自動で出現) → 予約サイトに即反映され、検索フィルタにも表示されます。
      </p>
    </div>

    <div style="text-align:right;margin-bottom:10px">
      <button id="btn-add" class="btn btn-primary">+ カテゴリ追加</button>
    </div>

    <section class="card">
      <table class="data-table list">
        <thead>
          <tr><th>アイコン</th><th>カテゴリ名</th><th>種別</th><th>カスタム項目</th><th>登録数</th><th>表示順</th><th>状態</th><th></th></tr>
        </thead>
        <tbody id="tbl"><tr class="empty"><td colspan="8">読み込み中...</td></tr></tbody>
      </table>
    </section>
  </main>

  <script src="partials.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/pricing.js"></script>
  <script src="../js/api.js"></script>
  <script>
  (function () {
    const S = window.SkyRentStore;
    const $ = s => document.querySelector(s);
    function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

    function render() {
      const cats = S.categories(true);
      $('#tbl').innerHTML = cats.map((c, i) => {
        const cnt = S.assets({ categoryId: c.categoryId }).length;
        const typeChip = c.type === 'item'
          ? '<span class="chip chip-common">物品 (在庫数管理)</span>'
          : '<span class="chip">車両 (免許・車検管理)</span>';
        return '<tr>' +
          '<td style="font-size:22px;text-align:center">' + esc(c.icon || '📦') + '</td>' +
          '<td><strong>' + esc(c.name) + '</strong>' + (c.nameEn ? '<br><small style="color:#999">' + esc(c.nameEn) + '</small>' : '') + '</td>' +
          '<td>' + typeChip + '</td>' +
          '<td>' + (c.customFieldDefs || []).length + ' 項目</td>' +
          '<td style="text-align:center">' + cnt + '</td>' +
          '<td style="text-align:center">' + (c.sort || '-') + '</td>' +
          '<td><span class="status ' + (c.active !== false ? 'status-confirmed' : 'status-cancelled') + '">' + (c.active !== false ? '有効' : '無効') + '</span></td>' +
          '<td style="text-align:center"><a href="#" class="detail-link" data-edit="' + c.categoryId + '">編集</a></td>' +
          '</tr>';
      }).join('');
      $('#tbl').querySelectorAll('[data-edit]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); openModal(a.dataset.edit); }));
    }

    function fieldDefRow(def) {
      def = def || { key: '', label: '', type: 'text', unit: '', options: [], filterable: false };
      const opts = Array.isArray(def.options) ? def.options.join(', ') : (def.options || '');
      return '<div class="field-def-row" data-key="' + esc(def.key || '') + '">' +
        '<input type="text" class="fd-label" placeholder="項目名 (例: シンク数)" value="' + esc(def.label) + '" style="flex:1;min-width:120px">' +
        '<select class="fd-type"><option value="text"' + (def.type === 'text' ? ' selected' : '') + '>テキスト</option><option value="number"' + (def.type === 'number' ? ' selected' : '') + '>数値</option><option value="select"' + (def.type === 'select' ? ' selected' : '') + '>選択式</option></select>' +
        '<input type="text" class="fd-unit" placeholder="単位" value="' + esc(def.unit || '') + '" style="width:70px">' +
        '<input type="text" class="fd-options" placeholder="選択肢 (カンマ区切り)" value="' + esc(opts) + '" style="flex:1;min-width:120px' + (def.type === 'select' ? '' : ';opacity:.4') + '">' +
        '<label style="font-size:12px;white-space:nowrap"><input type="checkbox" class="fd-filter"' + (def.filterable ? ' checked' : '') + '> フィルタ表示</label>' +
        '<button type="button" class="btn btn-gray fd-del" style="padding:4px 10px">×</button>' +
        '</div>';
    }

    function openModal(categoryId) {
      const isNew = !categoryId;
      const c = isNew
        ? { categoryId: '', name: '', nameEn: '', type: 'vehicle', icon: '📦', sort: 99, active: true, description: '', customFieldDefs: [] }
        : Object.assign({}, S.getCategory(categoryId));

      const html =
        '<div class="crud-modal-bg"></div><div class="crud-modal-card" style="min-width:640px">' +
        '<div class="crud-modal-head"><h3>' + (isNew ? 'カテゴリ追加' : 'カテゴリ編集') + '</h3><button class="crud-close" type="button">×</button></div>' +
        '<div style="padding:18px 22px">' +
          '<div class="crud-field"><label>カテゴリ名 <span style="color:#c0392b">*</span></label><input type="text" id="c-name" value="' + esc(c.name) + '"></div>' +
          '<div class="crud-field"><label>英語名</label><input type="text" id="c-nameEn" value="' + esc(c.nameEn || '') + '"></div>' +
          '<div class="crud-field"><label>種別</label><select id="c-type"><option value="vehicle"' + (c.type === 'vehicle' ? ' selected' : '') + '>車両レンタル (免許入力・車検管理あり)</option><option value="item"' + (c.type === 'item' ? ' selected' : '') + '>物品レンタル (在庫数管理・免許入力なし)</option></select></div>' +
          '<div class="crud-field"><label>アイコン (絵文字)</label><input type="text" id="c-icon" value="' + esc(c.icon || '') + '" maxlength="4" style="max-width:80px;flex:none"></div>' +
          '<div class="crud-field"><label>説明文</label><textarea id="c-desc" rows="2">' + esc(c.description || '') + '</textarea></div>' +
          '<div class="crud-field"><label>表示順</label><input type="number" id="c-sort" value="' + (c.sort || 99) + '" style="max-width:100px;flex:none"></div>' +
          '<div class="crud-field"><label>有効</label><select id="c-active"><option value="true"' + (c.active !== false ? ' selected' : '') + '>有効</option><option value="false"' + (c.active === false ? ' selected' : '') + '>無効</option></select></div>' +
          '<div style="margin:16px 0 8px"><strong class="card-section-title">カスタム項目 (このカテゴリ固有のスペック・検索条件)</strong></div>' +
          '<div id="field-defs">' + (c.customFieldDefs || []).map(fieldDefRow).join('') + '</div>' +
          '<button type="button" class="btn btn-gray" id="add-field" style="margin-top:6px">+ 項目を追加</button>' +
        '</div>' +
        '<div class="crud-modal-foot">' +
          (isNew ? '' : '<button type="button" class="btn btn-gray" id="c-delete" style="background:#c0392b">削除</button>') +
          '<span style="flex:1"></span><button type="button" class="btn btn-gray crud-cancel">キャンセル</button><button type="button" class="btn btn-primary" id="c-save">保存</button>' +
        '</div></div>';

      let modal = document.getElementById('crud-modal');
      if (!modal) { modal = document.createElement('div'); modal.id = 'crud-modal'; modal.className = 'crud-modal'; document.body.appendChild(modal); }
      modal.innerHTML = html;
      const close = () => modal.remove();
      modal.querySelector('.crud-modal-bg').addEventListener('click', close);
      modal.querySelector('.crud-close').addEventListener('click', close);
      modal.querySelector('.crud-cancel').addEventListener('click', close);

      // 種別による field type=select の options 有効/無効表示
      function bindRow(row) {
        const typeSel = row.querySelector('.fd-type');
        const optInput = row.querySelector('.fd-options');
        const sync = () => { optInput.style.opacity = typeSel.value === 'select' ? '1' : '.4'; };
        typeSel.addEventListener('change', sync); sync();
        row.querySelector('.fd-del').addEventListener('click', () => row.remove());
      }
      modal.querySelectorAll('.field-def-row').forEach(bindRow);
      modal.querySelector('#add-field').addEventListener('click', () => {
        const wrap = document.createElement('div');
        wrap.innerHTML = fieldDefRow();
        const row = wrap.firstChild;
        modal.querySelector('#field-defs').appendChild(row);
        bindRow(row);
      });

      modal.querySelector('#c-save').addEventListener('click', () => {
        const name = modal.querySelector('#c-name').value.trim();
        if (!name) { alert('カテゴリ名は必須です'); return; }
        const defs = [...modal.querySelectorAll('.field-def-row')].map(row => {
          const label = row.querySelector('.fd-label').value.trim();
          if (!label) return null;
          const type = row.querySelector('.fd-type').value;
          let key = row.dataset.key;
          if (!key) { key = label.replace(/[^a-zA-Z0-9]/g, ''); if (!key) key = 'f' + Math.floor(Math.random() * 100000); }
          const optionsRaw = row.querySelector('.fd-options').value.trim();
          return {
            key: key, label: label, type: type,
            unit: row.querySelector('.fd-unit').value.trim(),
            options: type === 'select' ? optionsRaw.split(',').map(s => s.trim()).filter(Boolean) : [],
            filterable: row.querySelector('.fd-filter').checked
          };
        }).filter(Boolean);

        const obj = {
          categoryId: isNew ? ('cat-' + Date.now()) : c.categoryId,
          name: name, nameEn: modal.querySelector('#c-nameEn').value.trim(),
          type: modal.querySelector('#c-type').value,
          icon: modal.querySelector('#c-icon').value.trim() || '📦',
          description: modal.querySelector('#c-desc').value.trim(),
          sort: parseInt(modal.querySelector('#c-sort').value, 10) || 99,
          active: modal.querySelector('#c-active').value === 'true',
          customFieldDefs: defs
        };
        S.upsert('categories', 'categoryId', obj);
        close(); render();
      });

      const del = modal.querySelector('#c-delete');
      if (del) del.addEventListener('click', () => {
        const cnt = S.assets({ categoryId: c.categoryId }).length;
        if (cnt > 0) { alert(cnt + ' 件のアイテムが登録されているため削除できません。先に「車両・物品管理」で移動または削除してください。'); return; }
        if (!confirm('カテゴリ「' + c.name + '」を削除しますか?')) return;
        S.removeById('categories', 'categoryId', c.categoryId);
        close(); render();
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      $('#btn-add').addEventListener('click', () => openModal(null));
      render();
    });
  })();
  </script>
</body>
</html>
