<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoogleAnalytics連携設定 | グロースレンタカー 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">GoogleAnalytics連携設定</h1>
    <p class="page-note" id="page-note">予約サイトへのアクセス解析を有効化。GA4 のトラッキングID (G-XXXXXXX) を入力してください。</p>

    <section class="card" style="padding:24px">
      <div class="form-row">
        <label>GA4 測定ID</label>
        <input type="text" class="form-input" data-setting="ga4Id" placeholder="G-XXXXXXXXXX">
      </div>
      <div class="form-row">
        <label>Universal Analytics ID</label>
        <input type="text" class="form-input" data-setting="uaId" placeholder="UA-XXXXXXXXX-X (旧版・任意)">
      </div>
      <div class="form-row" style="border-bottom:0;padding-top:0">
        <label></label>
        <small style="flex:1;color:#777;font-size:12px">Universal Analytics (UA-) は Google 側で計測が終了しています。新しく設定する場合は GA4 の測定ID (G-) を使ってください。</small>
      </div>
      <div class="form-row">
        <label>イベント計測</label>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px">
          <label class="chk"><input type="checkbox" data-setting="event.purchase" checked> 予約完了 (purchase)</label>
          <label class="chk"><input type="checkbox" data-setting="event.viewItem" checked> 車種ページ閲覧 (view_item)</label>
          <label class="chk"><input type="checkbox" data-setting="event.search"> 検索イベント (search)</label>
        </div>
      </div>
      <div class="form-row">
        <label>クロスドメイン</label>
        <input type="text" class="form-input" data-setting="crossDomain" placeholder="example.com,example.jp">
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" data-save>保存する</button>
      </div>
    </section>

    <section class="card" style="margin-top:14px;padding:24px">
      <h3 style="margin-bottom:14px;font-size:15px;color:var(--primary)">Google Search Console 連携</h3>
      <div class="form-row">
        <label>所有権確認用メタタグ</label>
        <input type="text" class="form-input" data-setting="gscMeta" placeholder='<meta name="google-site-verification" content="..." />'>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" data-save>保存する</button>
      </div>
    </section>
  </main>

  <style>.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}</style>
  <script src="partials.js"></script>
  <script src="js/settings.js"></script>

  <script src="../js/config.js?v=20260923"></script>
  <script src="../js/store.js?v=20260923"></script>
  <script src="../js/pricing-core.js?v=20260923"></script>
  <script src="../js/pricing.js?v=20260923"></script>
  <script src="../js/backend.js?v=20260923"></script>
  <script src="../js/boot.js?v=20260923"></script>
  <script type="text/x-deferred">
  (function () {
    'use strict';
    const B = window.SkyRentBackend;
    // 保存されている値 (本番はサーバー、デモはこのブラウザ) をフォームに出す。
    // 既定値 (予約完了・車種ページ閲覧の計測 = ON) は HTML の初期値で持ち、保存済みの値は上書きしない
    SkyRentSettings.init('ga');
    const id = document.querySelector('[data-setting="ga4Id"]');
    if (id) id.addEventListener('blur', () => { id.value = id.value.trim(); });
    if (!B.admin.can('settings.write')) {
      document.querySelectorAll('[data-setting], [data-save]').forEach(el => { el.disabled = true; });
      document.getElementById('page-note').textContent = '予約サイトへのアクセス解析の設定です (変更は管理者だけが行えます)。';
    }
  })();
  </script>
</body>
</html>
