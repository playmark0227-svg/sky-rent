<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロフィール | グロースレンタカー 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">プロフィール</h1>
    <p class="page-note">ログインユーザーの情報を編集します。</p>

    <section class="card" style="padding:24px">
      <h3 style="margin-bottom:14px;font-size:15px;color:var(--primary)">基本情報</h3>
      <div class="form-row">
        <label>氏名</label>
        <input type="text" class="form-input" data-setting="name" value="山田 太郎">
      </div>
      <div class="form-row">
        <label>メールアドレス</label>
        <input type="email" class="form-input" data-setting="email" value="yamada@sky-rent.example.com">
      </div>
      <div class="form-row">
        <label>権限</label>
        <input type="text" class="form-input" value="管理者" readonly style="background:#f5f5f5">
      </div>
      <div class="form-row">
        <label>事業者コード</label>
        <input type="text" class="form-input" value="c00000-000001" readonly style="background:#f5f5f5">
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" data-save>変更を保存</button>
      </div>
    </section>

    <section class="card" style="margin-top:14px;padding:24px">
      <h3 style="margin-bottom:14px;font-size:15px;color:var(--primary)">パスワード変更</h3>
      <div class="form-row">
        <label>現在のパスワード</label>
        <input type="password" class="form-input" id="cur-pw">
      </div>
      <div class="form-row">
        <label>新しいパスワード</label>
        <input type="password" class="form-input" id="new-pw" minlength="8">
      </div>
      <div class="form-row">
        <label>確認 (再入力)</label>
        <input type="password" class="form-input" id="new-pw2">
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="btn-pw">パスワードを変更</button>
      </div>
    </section>

    <section class="card" style="margin-top:14px;padding:24px">
      <h3 style="margin-bottom:6px;font-size:15px;color:var(--primary)">データのバックアップ / 復元</h3>
      <p style="font-size:12px;color:var(--muted);margin-bottom:14px">
        車輌・予約・各種設定などすべてのデータを 1 つの JSON ファイルに書き出し / 読み込みできます。
        定期的なバックアップや、別の端末への移行にご利用ください。
      </p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-primary" id="btn-export">⬇ バックアップをダウンロード</button>
        <button class="btn btn-gray" id="btn-import-trigger">⬆ バックアップから復元</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
        <span id="data-stat" style="font-size:12px;color:var(--muted)"></span>
      </div>
    </section>

    <section class="card" style="margin-top:14px;padding:24px;border-color:#fde8e6">
      <h3 style="margin-bottom:6px;font-size:15px;color:#c0392b">危険ゾーン</h3>
      <p style="font-size:12px;color:var(--muted);margin-bottom:14px">以下の操作は元に戻せません。実行前にバックアップをおすすめします。</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-gray" id="btn-logout">ログアウト</button>
        <button class="btn btn-gray" id="btn-reset" style="background:#c0392b">設定を初期化 (全データ削除)</button>
      </div>
    </section>
  </main>

  <script src="partials.js"></script>
  <script src="js/settings.js"></script>
  <script>
    SkyRentSettings.init('profile');

    document.querySelector('#btn-pw').addEventListener('click', () => {
      const cur = document.querySelector('#cur-pw').value;
      const n1 = document.querySelector('#new-pw').value;
      const n2 = document.querySelector('#new-pw2').value;
      if (!cur || !n1) return alert('現在のパスワードと新パスワードを入力してください');
      if (n1.length < 8) return alert('パスワードは 8 文字以上にしてください');
      if (n1 !== n2) return alert('新パスワードと確認が一致しません');
      SkyRentSettings.showToast('✓ パスワードを変更しました');
      document.querySelector('#cur-pw').value = '';
      document.querySelector('#new-pw').value = '';
      document.querySelector('#new-pw2').value = '';
    });

    document.querySelector('#btn-logout').addEventListener('click', () => {
      if (!confirm('ログアウトしますか?')) return;
      sessionStorage.removeItem('sky-rent.session');
      window.location.href = 'login.html';
    });

    document.querySelector('#btn-reset').addEventListener('click', () => {
      if (!confirm('全ての設定・データを削除します。本当に続行しますか?')) return;
      if (!confirm('元に戻せません。本当によろしいですか?')) return;
      Object.keys(localStorage).forEach(k => {
        if (k.startsWith('sky-rent.')) localStorage.removeItem(k);
      });
      alert('全データを削除しました。ページを再読み込みします。');
      window.location.href = 'dashboard.html';
    });

    // ===== データのバックアップ / 復元 =====
    function collectData() {
      const out = {};
      Object.keys(localStorage).forEach(k => {
        if (k.startsWith('sky-rent.')) out[k] = localStorage.getItem(k);
      });
      return out;
    }

    // 現在のデータ統計を表示
    (function updateStat() {
      const data = collectData();
      let vehicles = 0, reservations = 0;
      try { vehicles = (JSON.parse(data['sky-rent.vehicles'] || '[]')).length; } catch (e) {}
      try { reservations = (JSON.parse(data['sky-rent.reservations'] || '[]')).length; } catch (e) {}
      document.querySelector('#data-stat').textContent =
        `保存済み: 車輌 ${vehicles} 台 / 予約 ${reservations} 件 / 設定キー ${Object.keys(data).length} 項目`;
    })();

    document.querySelector('#btn-export').addEventListener('click', () => {
      const payload = {
        _app: 'sky-rent',
        _version: 1,
        _exportedAt: new Date().toISOString(),
        data: collectData()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const d = new Date();
      const stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
      a.href = url;
      a.download = `sky-rent-backup-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      SkyRentSettings.showToast('✓ バックアップをダウンロードしました');
    });

    document.querySelector('#btn-import-trigger').addEventListener('click', () => {
      document.querySelector('#import-file').click();
    });

    document.querySelector('#import-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const data = parsed && parsed.data ? parsed.data : parsed;
          if (!data || typeof data !== 'object') throw new Error('形式が正しくありません');
          const keys = Object.keys(data).filter(k => k.startsWith('sky-rent.'));
          if (!keys.length) throw new Error('グロースレンタカー のデータが見つかりません');
          if (!confirm(`バックアップから ${keys.length} 項目を復元します。\n現在のデータは上書きされます。続行しますか?`)) {
            e.target.value = '';
            return;
          }
          keys.forEach(k => localStorage.setItem(k, data[k]));
          alert('✓ 復元しました。ページを再読み込みします。');
          window.location.reload();
        } catch (err) {
          alert('復元に失敗しました: ' + err.message);
        } finally {
          e.target.value = '';
        }
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
