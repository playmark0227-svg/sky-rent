<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顧客料金種別管理 | Sky Rent 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">顧客料金種別管理</h1>
    <p class="page-note">顧客カテゴリごとの料金体系。法人会員・リピーター・観光客など、属性別に料金を変更できます。</p>

    <section class="card">
      <table class="data-table list">
        <thead>
          <tr><th>種別ID</th><th>種別名</th><th>割引率</th><th>適用条件</th><th>会員数</th><th>備考</th><th></th></tr>
        </thead>
        <tbody>
          <tr><td><code>R001</code></td><td><strong>一般</strong></td><td>0%</td><td>誰でも</td><td>-</td><td>標準料金</td><td><a href="#" class="detail-link">編集</a></td></tr>
          <tr><td><code>R002</code></td><td><strong>会員</strong></td><td>5%</td><td>会員登録者</td><td>32名</td><td>初回割引なし</td><td><a href="#" class="detail-link">編集</a></td></tr>
          <tr><td><code>R003</code></td><td><strong>法人</strong></td><td>10%</td><td>法人契約</td><td>5社</td><td>請求書払い可</td><td><a href="#" class="detail-link">編集</a></td></tr>
          <tr><td><code>R004</code></td><td><strong>リピーター</strong></td><td>8%</td><td>3回以上利用</td><td>14名</td><td>自動付与</td><td><a href="#" class="detail-link">編集</a></td></tr>
          <tr><td><code>R005</code></td><td><strong>VIP</strong></td><td>15%</td><td>年間10万円以上</td><td>3名</td><td>個別対応</td><td><a href="#" class="detail-link">編集</a></td></tr>
        </tbody>
      </table>
    </section>
    <div style="text-align:right;margin-top:12px"><button class="btn btn-primary">+ 新規追加</button></div>
  </main>
  <script src="_partials.js"></script>
</body>
</html>
