<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顧客料金種別管理 | グロースレンタカー 管理画面</title>
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <div data-include="topbar"></div>

  <main class="main">
    <h1 class="page-title">顧客料金種別管理</h1>
    <p class="page-note">顧客カテゴリごとの料金体系。</p>

    <div style="text-align:right;margin-bottom:10px">
      <button id="btn-add" class="btn btn-primary">+ 新規追加</button>
    </div>

    <section class="card">
      <table class="data-table list">
        <thead>
          <tr>
            <th>種別ID</th><th>種別名</th><th>割引率</th><th>適用条件</th><th>会員数</th><th>備考</th><th></th>
          </tr>
        </thead>
        <tbody id="tbl"></tbody>
      </table>
    </section>
  </main>

  <script src="partials.js"></script>
  <script src="js/crud.js"></script>
  <script>
  SkyRentCRUD.init({
    storageKey: 'customer-rates',
    idPrefix: 'R',
    columns: [
      { key: 'id', label: '種別ID', code: true, readonly: true },
      { key: 'name', label: '種別名', bold: true, required: true },
      { key: 'discount', label: '割引率', type: 'percent' },
      { key: 'condition', label: '適用条件' },
      { key: 'memberCount', label: '会員数', center: true },
      { key: 'note', label: '備考' }
    ],
    defaults: [
      { id: 'R001', name: '一般',         discount: 0,  condition: '誰でも',         memberCount: '-',   note: '標準料金' },
      { id: 'R002', name: '会員',         discount: 5,  condition: '会員登録者',     memberCount: '32名', note: '初回割引なし' },
      { id: 'R003', name: '法人',         discount: 10, condition: '法人契約',       memberCount: '5社',  note: '請求書払い可' },
      { id: 'R004', name: 'リピーター',   discount: 8,  condition: '3回以上利用',    memberCount: '14名', note: '自動付与' },
      { id: 'R005', name: 'VIP',          discount: 15, condition: '年間10万円以上', memberCount: '3名',  note: '個別対応' }
    ]
  });
  </script>
</body>
</html>
